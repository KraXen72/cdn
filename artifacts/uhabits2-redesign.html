@media(min-width:1650px){main{padding:28px 40px}.phones{gap:32px}}@media(max-width:1430px){.studio-layout{grid-template-columns:190px minmax(0,1fr)}main{padding:22px 18px}.phones{gap:14px;justify-content:start;overflow-x:auto;padding:0 0 16px}.intro-actions .button-label{display:none}.notes-grid{gap:16px}}@media(max-width:800px){.studio-header{padding:0 16px;height:58px}.brand span{display:none}.studio-layout{display:block}aside{position:static;height:auto;padding:10px 12px;border-right:0;border-bottom:1px solid var(--line)}.nav-label,.side-footer{display:none}.directions{display:flex;overflow-x:auto;gap:6px}.direction{flex-shrink:0;border:1px solid var(--line);padding:8px 11px}.direction .name{font-size:13px}.direction .saved-dot{display:none}main{padding:18px 14px}.intro{align-items:start;gap:12px}h1{font-size:25px}.description{font-size:14px}.header-actions .studio-button{padding:7px 9px;font-size:13px}.header-actions svg{display:none}.phones{justify-content:start;gap:16px}.notes-grid{grid-template-columns:1fr;gap:14px}.screen-label{margin-left:3px}.overview-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.overview-preview{height:300px}.overview-preview .device{transform:scale(.37)}.overview-info{padding:10px;font-size:13px}.overview-info small{font-size:12px}.intro-actions{gap:4px}.intro-actions .studio-button{padding:8px}.intro-actions svg{width:18px;height:18px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}@media print{aside,.studio-header,.screen-tabs,.intro-actions,.bottom-tip{display:none}.studio-layout{display:block}main{padding:0;max-width:none}.phones{overflow:visible;grid-template-columns:repeat(3,360px)}.device{box-shadow:none}.notes-grid{break-inside:avoid}body{background:white;color:black}}

<body>
<header class="studio-header"><div class="brand"><div class="brand-icon"><svg viewBox="0 0 24 24"><path d="M20 7a9 9 0 1 0 1 8M8 11l4 4 9-10"/></svg></div>uhabits2 <span>Design directions</span></div><div class="header-actions"><button class="studio-button" id="overview-button">Overview · 10</button><button class="studio-button" id="compare-button">Shortlist <span id="shortlist-count">0</span></button></div></header>
<div class="studio-layout"><aside><p class="nav-label">EXPLORE DIRECTIONS</p><nav class="directions" aria-label="Design directions" id="directions"></nav><div class="side-footer"><strong>30 screens · 10 directions</strong>Same habits and data throughout.<br>360 × 800 Android viewports.<a href="#" id="reset-demo">Reset demo data</a><a href="#" id="download">Download standalone HTML</a></div></aside><main id="main"></main></div>
<div id="toast" class="toast" role="status" hidden></div>
<script>
'use strict';
const paths={check:'M5 12l4 4L19 6',plus:'M12 5v14M5 12h14',back:'M19 12H5m6-6-6 6 6 6',more:'M12 5h.01M12 12h.01M12 19h.01',filter:'M4 6h16M7 12h10M10 18h4',book:'M12 5v15M12 5C8 2 3 4 3 4v14s5-2 9 2c4-4 9-2 9-2V4s-5-2-9 1Z',water:'M12 3C9 7 5 11 5 15a7 7 0 0 0 14 0c0-4-4-8-7-12Zm-3 12a3 3 0 0 0 3 3',walk:'M13 7l-3 5 4 3-1 6M10 12l-4 8M13 7l4 5h3M13 7l-5 1-3 4M15 3h.01',stretch:'M5 5l14 14M8 3 3 8M21 16l-5 5M11 6l-5 5M18 13l-5 5',journal:'M5 4h12a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2V4Zm0 12h14M9 8h6M9 11h4',sleep:'M3 18V8m0 7h18v5m-18-9h18v7M7 8h3v3H7Z',chart:'M4 20V10h4v10M10 20V4h4v16M16 20v-8h4v8',grid:'M3 3h7v7H3ZM14 3h7v7h-7ZM3 14h7v7H3ZM14 14h7v7h-7Z',calendar:'M4 5h16v16H4ZM8 3v4m8-4v4M4 10h16',trophy:'M8 3h8v7a4 4 0 0 1-8 0V3Zm0 2H4v3a4 4 0 0 0 4 4m8-7h4v3a4 4 0 0 1-4 4m-4 2v6m-4 1h8',bell:'M6 16h12l-2-3V9a4 4 0 0 0-8 0v4l-2 3Zm4 3h4',edit:'m14 5 5 5M4 20l5-1L20 8l-5-5L4 14v6Z',arrow:'M5 12h14m-6-6 6 6-6 6',star:'m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3l-5.5 2.9 1-6.2L3 9.6l6.2-.9L12 3Z',close:'m6 6 12 12M6 18 18 6',sun:'M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6 7 7m10 10 1.4 1.4M5.6 18.4 7 17m10-10 1.4-1.4M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0Z',signal:'M3 18h2v3H3Zm5-5h2v8H8Zm5-5h2v13h-2Zm5-5h2v18h-2Z',battery:'M3 7h16v10H3ZM21 10v4M6 10h10v4H6Z',download:'M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4',settings:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8ZM10 3h4l1 3 3 1 3 3v4l-3 1-1 3-3 3h-4l-1-3-3-1-3-3v-4l3-1 1-3 3-3Z'};
const icon=(name,extra='')=>`<svg viewBox="0 0 24 24" aria-hidden="true" ${extra}><path d="${paths[name]||paths.star}"/></svg>`;
const designs=[
{id:'classic',name:'Current, refined',tag:'Continuity first',summary:'Keep the familiar history matrix. Fix spacing, contrast and hierarchy; make points legible without taking over.',layout:'matrix',fit:'Lowest',build:'Keep the existing RecyclerView, chart views and activity navigation. Update spacing, type, dividers and theme resources.',trade:'Three visible dates at 360dp keep each date target at 48dp. Horizontal history remains; the compact list still rewards familiarity.',signature:'Dense history matrix · flat surfaces · familiar teal'},
{id:'material',name:'Material 3',tag:'Platform familiar',summary:'A restrained baseline: tonal surfaces, standard list rows, modest typography and a clear navigation bar.',layout:'list',fit:'Moderate',build:'Material 3 theme, standard app bars, chips, checkboxes, cards and NavigationBarView. Reuse existing chart drawing and scoring.',trade:'The Today list gains clarity but hides the full history matrix behind History. A clear route back to dated entries is essential.',signature:'Tonal hierarchy · standard components · lavender seed'},
{id:'expressive',name:'M3 Expressive',tag:'Confident & playful',summary:'A stronger daily focal point, segmented habit groups and purposeful shape contrast. Expressive without becoming a game.',layout:'list',fit:'Moderate–high',build:'Expressive segmented lists, rounded toggles, emphasized type and spring feedback. Check dependency support; Compose is optional, not assumed.',trade:'More personality and larger shapes reduce above-the-fold density. This HTML approximates spring feedback, not native motion physics.',signature:'Lime hero · lilac contrast · segmented rows'},
{id:'widget',name:'Widget, expanded',tag:'Native to this fork',summary:'Bring the widget’s colored, outlined tiles into the app. Recognizable habits and generous, direct completion controls.',layout:'tiles',fit:'Moderate',build:'Use a grid RecyclerView and existing icon metadata. Reuse GridTileColors contrast logic and explicit/automatic state rules.',trade:'A tile fits fewer dates than the current matrix. A separate 48dp checkbox toggles; tapping the habit name opens details.',signature:'Habit-tinted tiles · colored outlines · compact geometry'},
{id:'oneui',name:'One UI inspired',tag:'Reachable & composed',summary:'A generous viewing area above a lower interaction area, grouped rows and a floating bottom navigation capsule.',layout:'list',fit:'Moderate',build:'CollapsingToolbarLayout or an equivalent scroll layout, inset grouped lists and a custom navigation container. Standard Android controls underneath.',trade:'The expanded heading trades density for easier one-handed use. It should collapse while scrolling. This is an interpretation of One UI 8.5.',signature:'Large viewing area · grouped rows · lower controls'},
{id:'glass',name:'Liquid glass',tag:'Depth with restraint',summary:'Cool atmospheric color, translucent surfaces and light-catching edges. Readability stays ahead of optical effects.',layout:'list',fit:'Highest',build:'Render a controlled background layer behind translucent cards; use supported blur APIs on Android 12+. API 28–30 and reduced-effects mode need opaque surfaces.',trade:'CSS backdrop-filter is a visual approximation, not a direct Android component. No refraction shader or live wallpaper dependency is assumed.',signature:'Frosted blue surfaces · soft depth · circular controls'},
{id:'editorial',name:'Daily journal',tag:'Warm & deliberate',summary:'An editorial reading rhythm: warm paper, serif headlines, fine rules and calm, almost printed data visualizations.',layout:'list',fit:'Moderate',build:'Standard list and chart views with light theme resources. Bundle a licensed serif face for consistent Android typography; system sans for controls.',trade:'More deliberate and less conventionally Android. Habit colors are darkened for light-surface contrast; the typography is the main identity.',signature:'Warm paper · serif hierarchy · fine rules'},
{id:'precision',name:'Precision',tag:'Data at a glance',summary:'A crisp instrument panel. Compact rows, aligned numbers and explicit borders make progress easy to scan.',layout:'matrix',fit:'Low–moderate',build:'Keep the existing date matrix and custom charts. Add tabular numerals, restrained borders and a segmented progress drawable.',trade:'Strong density and scanning, less warmth. Decorative labels stay small; primary text and tappable dates retain usable sizes.',signature:'Tabular numbers · cyan accents · exact alignment'},
{id:'zen',name:'Quiet focus',tag:'One habit at a time',summary:'A soft sage canvas and a single prominent next habit. The remaining habits stay close, without competing for attention.',layout:'focus',fit:'Moderate',build:'Use the existing habit order to choose the first unfinished habit. Render one focus card, then standard rows. No recommendation engine or new model required.',trade:'Useful for small daily routines; slower for checking many habits. The current order decides the next habit, rather than an invented priority system.',signature:'Single focus card · sage palette · soft circles'},
{id:'amoled',name:'AMOLED edge',tag:'Pure black, vivid signals',summary:'True black, bright habit accents and minimal containers. Let typography, fine separators and colored edges carry the layout.',layout:'list',fit:'Low–moderate',build:'Extend the existing AMOLED theme with flat list rows and color-edge drawables. Keep upstream graphs; retain visible focus and pressed states.',trade:'High contrast can feel stark. Thin outlines must survive low brightness; large black regions do not imply a measured battery improvement.',signature:'True black · bright habit edges · almost no cards'}
];
const habits=[{name:'Read',prompt:'A few pages, every day',icon:'book',color:'read',done:true},{name:'Drink water',prompt:'Make room for a water break',icon:'water',color:'water',done:false},{name:'Walk',prompt:'Step outside for a while',icon:'walk',color:'walk',done:true},{name:'Stretch',prompt:'A little room to move',icon:'stretch',color:'stretch',done:true},{name:'Journal',prompt:'Put the day into words',icon:'journal',color:'journal',done:false},{name:'Sleep on time',prompt:'Give tomorrow a good start',icon:'sleep',color:'sleep',done:false}];
const initialStates=habits.map(h=>h.done);
// Demo uses daily boolean habits with bonuses off, so each explicit completion earns 200.
const history=[600,800,1000,600,1200,800,400,1000,800,1200,1000,600,800,400,1000,1200,800,1000,600,800,1200,1000,600,800,1200,400,1000,800,1000,600];
const state={id:designs.some(d=>d.id===location.hash.slice(1))?location.hash.slice(1):'classic',mode:location.hash?'direction':'overview',screen:'all',selectedHabit:0,chartDay:29,opaque:false,filter:'all',shortlist:[],date:null};
try{state.shortlist=JSON.parse(localStorage.getItem('uhabits2-design-shortlist')||'[]').filter(id=>designs.some(d=>d.id===id));}catch{}
const $=s=>document.querySelector(s);
const fmt=n=>n.toLocaleString('en-US');
const earned=()=>habits.filter(h=>h.done).length*200;
const total=()=>history.slice(0,-1).reduce((sum,n)=>sum+n,0)+earned();
const dayLabel=i=>new Date(Date.UTC(2026,8,30+i)).toLocaleDateString('en-GB',{day:'numeric',month:'short',timeZone:'UTC'});
function status(){return `<div class="status"><span>9:41</span><div class="status-icons">${icon('signal')}${icon('battery')}</div></div>`}
function iconButton(name,label,action){return `<button class="icon-button" aria-label="${label}" data-action="${action}">${icon(name)}</button>`}
function toolbar(screen){return `<div class="toolbar">${screen==='list'?'':iconButton('back','Back to habits','back')}<span class="toolbar-title">${screen==='list'?'Habits':screen==='detail'?'Habit details':'Points history'}</span>${screen==='list'?iconButton('plus','Add habit','add')+iconButton('filter','Filter habits','filter'):screen==='detail'?iconButton('edit','Edit habit','edit'):''}${iconButton('more','More options','menu')}</div>`}
function progress(){return `<div class="progress" style="--progress:${earned()/1200*100}%"><i></i></div>`}
function dailyHero(d){return `<div class="hero daily-hero"><div class="hero-top"><div><div class="hero-label">Today’s points</div><div class="hero-value">${fmt(earned())} <small>/ 1,200</small></div></div>${d.id==='expressive'?`<div class="expressive-orbit">${icon('star')}</div>`:`<button class="icon-button" aria-label="Open points history" data-action="points">${icon('chart')}</button>`}</div>${progress()}<div class="caption">${habits.filter(h=>h.done).length} of 6 habits complete</div></div>`}
function chips(){return `<div class="chip-row"><button class="chip ${state.filter==='all'?'selected':''}" data-action="filter-all">All habits</button><button class="chip ${state.filter==='remaining'?'selected':''}" data-action="filter-remaining">Remaining · ${habits.filter(h=>!h.done).length}</button></div>`}
function check(h,i){return `<button class="check ${h.done?'done':''}" aria-label="${h.done?'Uncheck':'Complete'} ${h.name}" aria-pressed="${h.done}" data-toggle="${i}" style="--habit:var(--${h.color})">${icon('check')}</button>`}
function habitIcon(h){return `<span class="habit-icon" style="--habit:var(--${h.color})">${icon(h.icon)}</span>`}
function habitRows(indices){return `<div class="habit-list">${indices.map(i=>{const h=habits[i];return `<div class="habit-row" style="--habit:var(--${h.color})">${habitIcon(h)}<button class="habit-name" data-detail="${i}"><strong>${h.name}</strong><small>${h.done?'200 points earned':'Every day · 200 points'}</small></button>${check(h,i)}</div>`}).join('')}</div>`}
function matrix(indices){return `<div class="matrix"><div class="matrix-head"><span></span><span>TODAY<b>29</b></span><span>WED<b>28</b></span><span>TUE<b>27</b></span></div>${indices.map(i=>{const h=habits[i];return `<div class="matrix-row" style="--habit:var(--${h.color})"><button class="matrix-name" data-detail="${i}"><span class="tiny-ring"></span><span><strong>${h.name}</strong><small>${h.done?'200 pts':'Every day'}</small></span></button>${check(h,i)}<span class="past-check ${i%3===1?'missed':''}" aria-label="28 October: ${i%3===1?'not completed':'completed'}">${icon(i%3===1?'close':'check')}</span><span class="past-check ${i%2?'missed':''}" aria-label="27 October: ${i%2?'not completed':'completed'}">${icon(i%2?'close':'check')}</span></div>`}).join('')}<div class="matrix-footer"><span>Swipe dates in the Android app</span>${icon('arrow')}</div></div>`}
function tiles(indices){return `<div class="tile-grid">${indices.map(i=>{const h=habits[i];return `<div class="habit-tile ${h.done?'completed':''}" style="--habit:var(--${h.color})">${habitIcon(h)}${check(h,i)}<button class="habit-name" data-detail="${i}"><strong>${h.name}</strong><small>${h.done?'200 points earned':'200 points · every day'}</small></button></div>`}).join('')}</div>`}
function bottomNav(){return `<div class="bottom-nav"><button class="active" data-action="back"><span class="nav-icon">${icon('check')}</span>Today</button><button data-action="history"><span class="nav-icon">${icon('calendar')}</span>History</button><button data-action="points"><span class="nav-icon">${icon('chart')}</span>Points</button></div>`}
function list(d){let indices=habits.map((_,i)=>i).filter(i=>state.filter==='all'||!habits[i].done);let body='';if(d.layout==='matrix')body=matrix(indices);else if(d.layout==='tiles')body=tiles(indices);else if(d.layout==='focus'){const i=indices.find(i=>!habits[i].done);body=i===undefined?`<div class="focus-card"><h2>A little more consistent.</h2><p>All six habits are complete today.</p></div>`:`<div class="focus-card" style="--habit:var(--${habits[i].color})"><span class="focus-kicker">UP NEXT</span>${habitIcon(habits[i])}<h2>${habits[i].name}</h2><p>${habits[i].prompt}</p><button class="fab" data-toggle="${i}">${icon('check')}Mark complete</button></div>`;body+=`<div class="section-heading">Your routine <small>${indices.filter(n=>n!==i).length} habits</small></div>`+habitRows(indices.filter(n=>n!==i));}else body=habitRows(indices);
return `${toolbar('list')}<div class="content"><div class="list-masthead"><h2 class="page-title">${d.id==='editorial'?'The everyday.':d.id==='expressive'?'Make it a habit.':d.id==='zen'?'A little, each day.':d.id==='oneui'?'Your habits':d.id==='amoled'?'Show up.':d.id==='precision'?'Daily overview':d.id==='classic'?'Thursday, 29 Oct':'Today'}</h2><p class="subtitle">${d.id==='classic'?'Your habits, one day at a time.':'Thursday, 29 October'}</p></div>${dailyHero(d)}${d.layout==='matrix'?`<div class="section-heading">Your habits <small>Recent days</small></div>`:d.layout==='tiles'?`<div class="section-heading">Your habits <small>Today</small></div>`:d.layout==='focus'?'':chips()}${state.date?`<p class="note">Viewing ${state.date} · <button data-action="today" style="color:var(--accent)">Return to today</button></p>`:''}${body}${indices.length===0?'<p class="note">All habits completed. Switch to All habits to see your routine.</p>':''}${['classic','precision','widget','amoled','editorial'].includes(d.id)?`<div class="add-row"><button class="fab" data-action="add">${icon('plus')}New habit</button></div>`:d.id==='zen'?'':bottomNav()}</div>`}
function scoreChart(){return `<svg class="line-chart" viewBox="0 0 280 116" role="img" aria-label="Habit score rises from 45 percent to 78 percent over October"><path class="chart-grid" d="M0 20h280M0 58h280M0 96h280"/><path d="M3 91 30 84 55 86 82 68 108 63 135 53 161 57 187 38 215 32 241 23 277 14V106H3Z" fill="currentColor" fill-opacity=".07" stroke="none"/><path d="M3 91 30 84 55 86 82 68 108 63 135 53 161 57 187 38 215 32 241 23 277 14" stroke="currentColor" fill="none" stroke-width="2.5"/><circle cx="277" cy="14" r="4" fill="currentColor" stroke="none"/></svg><div class="chart-labels"><span>1 Oct</span><span>8</span><span>15</span><span>22</span><span>29 Oct</span></div>`}
function calendar(){return `<div class="calendar-head">${['M','T','W','T','F','S','S'].map(x=>`<span>${x}</span>`).join('')}</div><div class="calendar">${Array.from({length:35},(_,i)=>{let n=i-2;return n<1||n>31?'<span></span>':`<span class="day ${n<29&&n%5!==0?'hit':''} ${n===29?'today':''}">${n}</span>`}).join('')}</div>`}
function detail(d){const h=habits[state.selectedHabit];let markup=`${toolbar('detail')}<div class="content"><div class="detail-masthead"><div class="detail-icon" style="color:var(--${h.color})">${icon(h.icon)}</div><h2 class="page-title">${h.name}</h2><p class="subtitle">${h.prompt}</p><div class="detail-meta"><span>${icon('calendar')}Every day</span><span>${icon('bell')}Off</span><span>${icon('trophy')}200 points</span></div></div><div class="detail-action" style="--habit:var(--${h.color})"><div><strong>Today, 29 October</strong><small>${h.done?'Completed · 200 points earned':'Not completed yet'}</small></div>${check(h,state.selectedHabit)}</div><div class="stat-grid"><div class="stat"><strong>78%</strong><span>Habit score</span></div><div class="stat"><strong>+6 pp</strong><span>This month</span></div><div class="stat"><strong>24</strong><span>Completions</span></div></div><div class="panel"><div class="section-heading">Habit score <span class="period-pill">October</span></div><div style="color:var(--accent)">${scoreChart()}</div><div class="chart-legend"><i></i>Consistency over time</div></div><div class="panel"><div class="section-heading">Calendar <small>October 2026</small></div>${calendar()}</div><div class="panel"><div class="section-heading">Streaks <small>All time</small></div><div class="two-stats"><div><strong>6 <small>days</small></strong><small>Current</small></div><div><strong>12 <small>days</small></strong><small>Best</small></div></div></div><p class="note">200 base points · bonuses off in this demo</p></div>`;
if(d.id==='widget'||d.id==='zen'){
 const container=document.createElement('div');container.innerHTML=markup;
 const statGrid=container.querySelector('.stat-grid');
 statGrid.outerHTML=`<div class="panel score-summary"><div class="score-ring"><span>78%</span></div><div><strong>Habit score</strong><p class="caption">+6 pp this month</p><p class="caption">24 completions · 6-day streak</p></div></div>`;
 const calendarPanel=container.querySelector('.calendar').closest('.panel');
 const scorePanel=container.querySelector('.line-chart').closest('.panel');
 scorePanel.before(calendarPanel);
 markup=container.innerHTML;
}
return markup;}
function points(d){const best=history.map((n,i)=>({value:i===29?earned():n,i})).sort((a,b)=>b.value-a.value||b.i-a.i).slice(0,3);return `${toolbar('points')}<div class="content"><div class="points-masthead"><h2 class="page-title">${d.id==='editorial'?'Small wins,\nadded up.':d.id==='zen'?'It all adds up.':d.id==='amoled'?'Every point.':'Your progress'}</h2><p class="subtitle">Points history · last 30 days</p></div><div class="hero points-hero"><div class="hero-label">Total earned</div><div class="hero-value">${fmt(total())}<small> points</small></div>${d.id==='expressive'?`<div class="expressive-orbit">${icon('trophy')}</div>`:''}<div class="caption">${fmt(Math.round(total()/30))} daily average · 30 Sep – 29 Oct</div></div><div class="panel"><div class="section-heading">Daily points <span class="period-pill">30 days</span></div><div class="points-chart" role="group" aria-label="Daily points, 30 September to 29 October">${history.map((value,i)=>`<button class="bar ${state.chartDay===i?'selected':''}" data-bar="${i}" aria-label="${dayLabel(i)}: ${i===29?earned():value} points" style="--height:${Math.max(2,(i===29?earned():value)/1200*100)}%"></button>`).join('')}</div><div class="chart-labels"><span>30 Sep</span><span>10 Oct</span><span>20 Oct</span><span>29 Oct</span></div><div class="point-selection">${dayLabel(state.chartDay)} <strong>· ${fmt(state.chartDay===29?earned():history[state.chartDay])} points</strong></div></div><div class="panel"><div class="section-heading">Best days <small>All time</small></div>${best.map((day,i)=>`<div class="best-day"><span class="rank">0${i+1}</span><div>${dayLabel(day.i)} 2026<small>${day.value/200} completed habits</small></div><b>${fmt(day.value)}</b></div>`).join('')}</div><p class="note">Points follow your existing rewards and completion history.</p></div>`}
function phone(d,screen){return `<div class="device ${d.id} ${d.id==='glass'&&state.opaque?'opaque':''}" data-design="${d.id}" data-screen="${screen}">${status()}<div class="app">${screen==='list'?list(d):screen==='detail'?detail(d):points(d)}</div><div class="gesture"></div></div>`}
function saveSelection(){try{localStorage.setItem('uhabits2-design-shortlist',JSON.stringify(state.shortlist))}catch{}}
function renderNav(){ $('#directions').innerHTML=designs.map((d,i)=>`<button class="direction ${state.mode==='direction'&&d.id===state.id?'active':''}" data-direction="${d.id}" ${state.mode==='direction'&&d.id===state.id?'aria-current="page"':''}><span class="num">${String(i+1).padStart(2,'0')}</span><span class="name">${d.name}</span>${state.shortlist.includes(d.id)?'<span class="saved-dot" aria-label="Shortlisted"></span>':''}</button>`).join('');$('#shortlist-count').textContent=state.shortlist.length;$('#overview-button').setAttribute('aria-pressed',state.mode==='overview');$('#compare-button').setAttribute('aria-pressed',state.mode==='compare');}
function notes(d){return `<div class="notes-grid"><div><h2>Visual signature</h2><p>${d.signature}</p></div><div><h2>Android implementation · ${d.fit.toLowerCase()} effort</h2><p>${d.build}</p></div><div><h2>Tradeoff</h2><p>${d.trade}</p></div></div>`}
function render(){renderNav();const d=designs.find(x=>x.id===state.id);if(state.mode==='overview'){$('#main').innerHTML=`<div class="intro"><div><div class="eyebrow">The collection</div><h1>10 ways to build a daily ritual.</h1><p class="description">Each direction includes Today, Habit details and Points history. Open a direction to inspect all three.</p></div></div><div class="overview-grid">${designs.map((d,i)=>`<article class="overview-card" tabindex="0" role="button" data-direction="${d.id}" aria-label="Explore ${d.name}"><div class="overview-preview">${phone(d,'list')}</div><div class="overview-info">${String(i+1).padStart(2,'0')} / ${d.name}<small>${d.tag}</small></div></article>`).join('')}</div>`;return}if(state.mode==='compare'){$('#main').innerHTML=`<div class="intro"><div><div class="eyebrow">Your shortlist</div><h1>Compare directions</h1><p class="description">Same screen, side by side. Your shortlist is saved in this browser.</p></div></div>${screenTabs(false)}${state.shortlist.length?`<div class="compare-phones">${state.shortlist.map(id=>{const d=designs.find(x=>x.id===id);return `<div><h2 class="compare-title">${d.name}</h2>${phone(d,state.screen==='all'?'list':state.screen)}</div>`}).join('')}</div>`:'<div class="empty">Open a direction and choose “Shortlist” to add it here.</div>'}`;return}
$('#main').innerHTML=`<div class="intro"><div><div class="eyebrow">Direction ${String(designs.indexOf(d)+1).padStart(2,'0')} / 10 · ${d.tag}</div><h1>${d.name}</h1><p class="description">${d.summary}</p></div><div class="intro-actions">${d.id==='glass'?`<button class="studio-button" id="opaque-button" aria-pressed="${state.opaque}" title="Show opaque Android fallback">${icon('sun')}<span class="button-label">Opaque fallback</span></button>`:''}<button class="studio-button" id="save-button" aria-pressed="${state.shortlist.includes(d.id)}">${icon('star')}<span class="button-label">${state.shortlist.includes(d.id)?'Shortlisted':'Shortlist'}</span></button></div></div>${screenTabs(true)}<div class="phones" ${state.screen!=='all'?'style="grid-template-columns:360px;justify-content:center"':''}>${(state.screen==='all'?['list','detail','points']:[state.screen]).map((screen,i)=>`<section class="phone-column"><p class="screen-label"><span>${screen==='list'?'01':screen==='detail'?'02':'03'}</span>${screen==='list'?'Today / habit list':screen==='detail'?'Habit details':'Points history'}</p>${phone(d,screen)}</section>`).join('')}</div>${notes(d)}<p class="bottom-tip">Try the checkboxes, habit names, chart columns and filter. Sample data; no app data is changed. <button data-action="sources" style="color:var(--cyan);text-decoration:underline">References & prototype scope</button></p>`;}
function screenTabs(all){return `<div class="screen-tabs" role="group" aria-label="Screens">${(all?['all','list','detail','points']:['list','detail','points']).map(s=>`<button class="screen-tab ${state.screen===s||!all&&state.screen==='all'&&s==='list'?'active':''}" data-screen-tab="${s}" aria-pressed="${state.screen===s||!all&&state.screen==='all'&&s==='list'}">${s==='all'?'All three screens':s==='list'?'Today':s==='detail'?'Habit details':'Points history'}</button>`).join('')}</div>`}
function notify(message){$('#toast').textContent=message;$('#toast').hidden=false;clearTimeout(notify.timer);notify.timer=setTimeout(()=>{$('#toast').hidden=true},2600)}
function selectDesign(id){state.id=id;state.mode='direction';state.screen='all';state.date=null;historyReplace(id);render()}
function historyReplace(id){window.history.replaceState(null,'','#'+id)}
function sheet(device,title,body){device.querySelector('.sheet-backdrop')?.remove();device.insertAdjacentHTML('beforeend',`<div class="sheet-backdrop"><section class="sheet" role="dialog" aria-modal="true" aria-label="${title}">${iconButton('close','Close dialog','close-sheet')}<h2>${title}</h2>${body}</section></div>`);device.querySelector('.sheet input,.sheet button:not([data-action="close-sheet"])')?.focus()}
function replacePhone(device,screen){const d=designs.find(x=>x.id===device.dataset.design);device.outerHTML=phone(d,screen)}
document.addEventListener('click',e=>{const target=e.target.closest('button,a,[data-direction],.sheet-backdrop');if(!target)return;
if(target.dataset.direction){selectDesign(target.dataset.direction);return}if(target.dataset.screenTab){state.screen=target.dataset.screenTab;render();return}if(target.id==='overview-button'){state.mode='overview';render();return}if(target.id==='compare-button'){state.mode='compare';render();return}if(target.id==='save-button'){state.shortlist=state.shortlist.includes(state.id)?state.shortlist.filter(x=>x!==state.id):[...state.shortlist,state.id];saveSelection();render();return}if(target.id==='opaque-button'){state.opaque=!state.opaque;render();return}if(target.id==='reset-demo'){e.preventDefault();habits.forEach((h,i)=>h.done=initialStates[i]);state.selectedHabit=0;state.chartDay=29;state.filter='all';state.date=null;render();notify('Demo data reset');return}if(target.id==='download'){e.preventDefault();const blob=new Blob(['<!doctype html>\n'+document.documentElement.outerHTML],{type:'text/html'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='uhabits2-design-directions.html';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return}
const device=target.closest('.device');if(target.dataset.toggle!==undefined){const i=Number(target.dataset.toggle);habits[i].done=!habits[i].done;const positions=[...document.querySelectorAll('.app')].map(x=>x.scrollTop);render();document.querySelectorAll('.app').forEach((x,i)=>x.scrollTop=positions[i]||0);notify(`${habits[i].name} ${habits[i].done?'completed · +200 points':'unchecked · −200 points'}`);return}if(target.dataset.detail!==undefined){state.selectedHabit=Number(target.dataset.detail);const detailDevice=document.querySelector('.phone-column .device[data-screen="detail"]');if(detailDevice){replacePhone(detailDevice,'detail');document.querySelector('.phone-column .device[data-screen="detail"]').scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'})}else replacePhone(device,'detail');return}if(target.dataset.bar!==undefined){state.chartDay=Number(target.dataset.bar);device.querySelectorAll('.bar').forEach(x=>x.classList.toggle('selected',x===target));device.querySelector('.point-selection').innerHTML=`${dayLabel(state.chartDay)} <strong>· ${fmt(state.chartDay===29?earned():history[state.chartDay])} points</strong>`;return}
const action=target.dataset.action;if(action==='sources'){showSources();return}if(!device)return;if(target.classList.contains('sheet-backdrop')){if(e.target===target)target.remove();return}if(action==='close-sheet'){device.querySelector('.sheet-backdrop')?.remove();return}if(action==='points'||action==='back'){replacePhone(device,action==='points'?'points':'list');return}if(action==='filter'){sheet(device,'Show habits',`<button class="menu-item" data-action="filter-all">${icon('grid')}All habits</button><button class="menu-item" data-action="filter-remaining">${icon('check')}Remaining today</button>`);return}if(action==='filter-all'||action==='filter-remaining'){state.filter=action==='filter-all'?'all':'remaining';render();return}if(action==='today'){state.date=null;replacePhone(device,'list');return}if(action==='menu'){sheet(device,'More options',`<button class="menu-item" data-action="points">${icon('chart')}Points history</button><button class="menu-item" data-action="history">${icon('calendar')}Browse habit history</button><button class="menu-item" data-action="prototype-settings">${icon('settings')}About this prototype</button>`);return}if(action==='history'){sheet(device,'Habit history',`<p>The redesign keeps Loop’s existing horizontal date browsing. The matrix directions show the last three days directly.</p><p>This prototype demonstrates layout and today’s completion controls. Past entries are static.</p><button class="fab" data-action="close-sheet">Back to habits</button>`);return}if(action==='add'||action==='edit'){const h=habits[state.selectedHabit];sheet(device,action==='add'?'New habit':'Edit habit',`<label for="demo-name">Habit name</label><input id="demo-name" value="${action==='edit'?h.name:''}" placeholder="e.g. Read" maxlength="40"><p>Every day · 200 base points<br>Streak and stretch bonuses off</p><p>Editor preview only. This mock-up keeps the same six habits so the directions remain comparable.</p><button class="fab" data-action="close-sheet">Done</button>`);return}if(action==='prototype-settings'){sheet(device,'About this prototype','<p>10 visual directions for uhabits2. Shared daily boolean habits, 200 points each, bonuses off. Charts and habit scores are illustrative; only daily points respond to checkboxes.</p><button class="fab" data-action="close-sheet">Done</button>')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelectorAll('.sheet-backdrop').forEach(x=>x.remove());$('#sources-dialog')?.close()}if((e.key==='Enter'||e.key===' ')&&e.target.matches('.overview-card')){e.preventDefault();selectDesign(e.target.dataset.direction)}});
function showSources(){let dialog=$('#sources-dialog');if(!dialog){dialog=document.createElement('dialog');dialog.id='sources-dialog';dialog.style.cssText='background:#1c1b1a;color:#e6e4d9;border:1px solid #575653;border-radius:8px;max-width:650px;padding:26px;line-height:1.6';dialog.innerHTML=`<button style="float:right" aria-label="Close references" onclick="this.closest('dialog').close()">${icon('close')}</button><h2 style="margin-top:0;font-size:22px">References & scope</h2><p>Based on this repository’s habit-list UI, AMOLED habit analytics, points history, widget screenshots and GridTileColors implementation.</p><p>These are design interpretations, not pixel-exact reproductions of system apps. All 30 screens use the same sample habits. Score, calendar and streak data are illustrative and static; the demo is not a replacement for Loop’s scoring logic.</p><p>Daily boolean habits earn 200 points each here, with bonuses disabled. Today, 30-day totals, daily average and best days update together when toggling. Bar selection reveals the value; the production app’s chart-to-date navigation is outside this prototype.</p><p>App viewports are 360 × 800 CSS px, approximating Android dp at default text scale. Primary text is 15–17px; compact metadata is smaller. Main controls target 48px. Native font scaling, TalkBack and predictive back need implementation-stage validation.</p><p><a href="https://m3.material.io/components/lists/overview" target="_blank" rel="noreferrer">Material lists: baseline and Expressive</a><br><a href="https://m3.material.io/styles/motion/overview/how-it-works" target="_blank" rel="noreferrer">Material spring motion</a><br><a href="https://developer.samsung.com/one-ui/structure/visual-depth.html" target="_blank" rel="noreferrer">Samsung One UI visual depth</a><br><a href="https://doc.samsungmobile.com/SM-S721U1/030901241008/wel.html" target="_blank" rel="noreferrer">Samsung One UI 8.5 visual changes</a><br><a href="https://developer.android.com/develop/ui/views/layout/custom-views/custom-drawing" target="_blank" rel="noreferrer">Android RenderEffect support</a></p><p>Editorial typography embeds Noto Serif under the SIL Open Font License 1.1; license text is included in this HTML file.</p><p>Glass uses CSS to approximate a controlled app backdrop. Native arbitrary backdrop blur is not assumed. Provide opaque surfaces on Android 9–11 and whenever effects are disabled.</p>`;document.body.append(dialog)}dialog.showModal()}
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(designs.some(d=>d.id===id)){state.id=id;state.mode='direction';render()}});
render();
</script>
