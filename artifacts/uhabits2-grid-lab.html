<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Habit grid · 12 directions</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: dark;
        --ink: #100f0f;
        --paper: #fffcf0;
        --fg: #cecdc3;
        --muted: #b7b5ac;
        --cyan: #3aa99f;
        --purple: #8b7ec8;
        --w: 320px;
        --h: 152px;
        font:
          15px/1.45 system-ui,
          sans-serif;
        background: var(--ink);
        color: var(--fg);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button,
      select {
        cursor: pointer;
      }
      button {
        color: inherit;
      }
      svg {
        display: block;
        width: 24px;
        height: 24px;
        flex-shrink: 0;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 10;
        background: #100f0ff5;
        border-bottom: 1px solid #403e3c;
        padding: 14px 24px;
        backdrop-filter: blur(16px);
      }
      .heading {
        display: flex;
        align-items: baseline;
        gap: 14px;
        flex-wrap: wrap;
      }
      h1 {
        font-size: 20px;
        letter-spacing: -0.5px;
        margin: 0;
        font-weight: 600;
      }
      header small {
        font-size: 15px;
        color: var(--muted);
      }
      .tools {
        display: flex;
        gap: 18px;
        align-items: center;
        flex-wrap: wrap;
        margin-top: 12px;
      }
      .tools label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 15px;
      }
      select,
      .tool {
        background: #282726;
        color: var(--fg);
        border: 1px solid #575653;
        border-radius: 6px;
        padding: 5px 8px;
      }
      input[type="range"] {
        accent-color: var(--cyan);
        width: 95px;
      }
      .tool:hover,
      .tool[aria-pressed="true"] {
        border-color: var(--cyan);
        color: #83d5cd;
      }
      .tools output {
        font-variant-numeric: tabular-nums;
        min-width: 47px;
      }
      .tools .push {
        margin-left: auto;
      }
      .summary {
        padding: 14px 24px 0;
        display: flex;
        gap: 16px;
        color: var(--muted);
        font-size: 15px;
      }
      .summary b {
        font-weight: 500;
        color: #b8abe4;
      }
      .gallery {
        padding: 20px 24px 40px;
        display: grid;
        grid-template-columns: repeat(
          auto-fit,
          minmax(min(100%, calc(var(--w) + 34px)), 1fr)
        );
        gap: 24px;
        max-width: 1700px;
        margin: auto;
      }
      .concept {
        min-width: 0;
        scroll-margin-top: 140px;
      }
      .concept-head {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
      }
      .num {
        font:
          12px ui-monospace,
          monospace;
        color: #9f9d96;
        border: 1px solid #575653;
        padding: 2px 5px;
        border-radius: 4px;
      }
      h2 {
        font-size: 17px;
        font-weight: 550;
        margin: 0;
        letter-spacing: -0.25px;
      }
      .save {
        margin-left: auto;
        border: 0;
        background: none;
        color: #9f9d96;
        padding: 5px;
      }
      .save svg {
        width: 19px;
        height: 19px;
      }
      .save[aria-pressed="true"] {
        color: #c4b9ef;
      }
      .save[aria-pressed="true"] svg {
        fill: #8b7ec844;
      }
      .concept p {
        font-size: 15px;
        color: var(--muted);
        margin: 8px 0 0;
        min-height: 44px;
        max-width: 430px;
      }
      .stage {
        border: 1px solid #343331;
        border-radius: 8px;
        min-height: calc(var(--h) + 38px);
        padding: 18px 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(ellipse at 10% 90%, #282638 0, transparent 65%),
          linear-gradient(125deg, #22272b, #18191a 50%, #292222);
        overflow: hidden;
      }
      .widget {
        width: var(--w);
        height: var(--h);
        max-width: 100%;
        display: flex;
        flex-direction: column;
        padding: 10px;
        gap: 7px;
        border-radius: 18px;
        position: relative;
        isolation: isolate;
        overflow: hidden;
        --accent: #a0d9d0;
        --tile: #ffffff08;
        --color: #f4f2ea;
        color: var(--color);
        background: #202020;
        box-shadow: 0 6px 22px #0003;
      }
      .widget-head {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 21px;
        flex-shrink: 0;
        font-size: 13px;
        line-height: 1;
        min-width: 0;
      }
      .total {
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      .total b {
        font-weight: 600;
      }
      .total .unit {
        opacity: 0.7;
      }
      .last {
        margin-left: auto;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 10px;
        opacity: 0.8;
        max-width: 100px;
      }
      .menu {
        display: flex;
        gap: 2px;
        flex-shrink: 0;
        margin-left: auto;
      }
      .menu i {
        display: block;
        width: 3px;
        height: 3px;
        border-radius: 100%;
        background: currentColor;
        opacity: 0.6;
      }
      .last + .menu {
        margin-left: 5px;
      }
      .tiles {
        display: grid;
        grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
        grid-template-rows: repeat(var(--rows), minmax(0, 1fr));
        gap: 5px;
        flex: 1;
        min-height: 0;
      }
      .habit {
        position: relative;
        border: 0;
        border-radius: 9px;
        min-height: 0;
        min-width: 0;
        padding: 3px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 2px;
        background: var(--tile);
        color: inherit;
        overflow: hidden;
        transition:
          background 0.18s,
          transform 0.18s,
          box-shadow 0.18s;
      }
      .habit:hover {
        filter: brightness(1.15);
      }
      .habit:focus-visible {
        outline: 2px solid #fff;
        outline-offset: -3px;
      }
      .habit .glyph {
        height: var(--icon);
        width: var(--icon);
        display: grid;
        place-items: center;
        flex-shrink: 0;
      }
      .glyph svg {
        width: 100%;
        height: 100%;
        stroke-width: 1.65;
      }
      .name {
        font-size: 10px;
        max-width: 100%;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        line-height: 1.1;
      }
      .tick {
        position: absolute;
        right: 3px;
        top: 3px;
        opacity: 0.3;
        width: 8px;
        height: 8px;
        border: 1px solid currentColor;
        border-radius: 2px;
      }
      .habit.done .tick {
        opacity: 1;
        background: currentColor;
      }
      .habit.done .tick:after {
        content: "";
        display: block;
        width: 5px;
        height: 3px;
        border-left: 1px solid var(--ink);
        border-bottom: 1px solid var(--ink);
        transform: translate(1px, 1px) rotate(-45deg);
      }
      .habit.done {
        background: #ffffff1b;
      }
      .index,
      .reward {
        display: none;
      }
      .micro-progress {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: #ffffff12;
      }
      .micro-progress i {
        display: block;
        height: 100%;
        width: var(--progress);
        background: var(--accent);
        transition: width 0.2s;
      }
      /* 01: hard edges, generous type, physical state changes. */
      .monolith {
        background: #e8e5da;
        color: #161615;
        border-radius: 0;
        padding: 0;
        gap: 0;
        box-shadow: 5px 5px 0 #0009;
      }
      .monolith .widget-head {
        height: 29px;
        padding: 0 9px;
        background: #161615;
        color: #e8e5da;
        font-family: ui-monospace, monospace;
        font-size: 12px;
      }
      .monolith .tiles {
        gap: 0;
      }
      .monolith .habit {
        border-radius: 0;
        border-right: 1px solid #161615;
        border-bottom: 1px solid #161615;
        align-items: flex-start;
        justify-content: space-between;
        padding: 5px 7px;
        background: none;
      }
      .monolith .habit.done {
        background: #c8e975;
      }
      .monolith .habit .glyph {
        align-self: flex-end;
        width: 19px;
        height: 19px;
      }
      .monolith .name {
        font-size: 10px;
        font-weight: 750;
        text-transform: uppercase;
        letter-spacing: -0.3px;
      }
      .monolith .index {
        display: block;
        position: absolute;
        top: 5px;
        left: 7px;
        font:
          8px ui-monospace,
          monospace;
        opacity: 0.6;
      }
      .monolith .tick {
        display: none;
      }
      .monolith .micro-progress {
        display: none;
      }
      /* 02: circles, orbital status rings, quiet typography. */
      .halo {
        background: #151b21;
        border: 1px solid #ffffff18;
        --accent: #a5e1db;
        padding: 9px 12px;
        border-radius: 24px;
      }
      .halo .tiles {
        gap: 4px;
      }
      .halo .habit {
        background: none;
        overflow: visible;
        gap: 3px;
      }
      .halo .glyph {
        border: 1px solid #78838a;
        border-radius: 100%;
        width: calc(var(--icon) + 10px);
        height: calc(var(--icon) + 10px);
        padding: 5px;
        color: #bbc6ce;
      }
      .halo .habit.done .glyph {
        color: #b6eee0;
        background: #58a68c20;
        border: 2px solid #9cd6bd;
        box-shadow: 0 0 12px #8ed9bd12;
      }
      .halo .habit.done {
        background: none;
      }
      .halo .tick {
        display: none;
      }
      .halo .name {
        font-size: 9px;
        color: #b3bec6;
      }
      .halo .total {
        font-weight: 350;
        letter-spacing: 0.1px;
      }
      .halo .micro-progress {
        height: 1px;
        bottom: 4px;
        left: 24px;
        right: 24px;
      }
      /* 03: Swiss grid; one red signal against editorial black and white. */
      .swiss {
        background: #f4f1e8;
        color: #171715;
        border-radius: 3px;
        padding: 9px 10px 8px 17px;
        --accent: #d14d41;
      }
      .swiss:before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 7px;
        background: #d14d41;
      }
      .swiss .widget-head {
        font-family: Arial, sans-serif;
        letter-spacing: -0.5px;
        font-size: 16px;
        font-weight: 750;
        border-bottom: 1px solid #171715;
        padding-bottom: 5px;
        height: 26px;
      }
      .swiss .unit {
        font-size: 10px;
        font-weight: 400;
        letter-spacing: 0;
      }
      .swiss .habit {
        background: none;
        border-radius: 0;
        align-items: flex-start;
        gap: 4px;
        border-right: 1px solid #17171522;
        padding-left: 5px;
      }
      .swiss .habit.done {
        color: #d14d41;
      }
      .swiss .habit .glyph {
        width: 19px;
        height: 19px;
      }
      .swiss .tick {
        display: none;
      }
      .swiss .name {
        font-weight: 600;
        font-size: 9px;
      }
      .swiss .index {
        display: block;
        font:
          7px ui-monospace,
          monospace;
        opacity: 0.5;
        position: absolute;
        right: 4px;
        top: 3px;
      }
      /* 04: tilework; saturated geometry and contrasting ink. */
      .mosaic {
        background: #211f1c;
        border-radius: 13px;
        padding: 7px;
        gap: 5px;
        --accent: #f6dd9b;
      }
      .mosaic .widget-head {
        padding: 0 4px;
        font-family: Georgia, serif;
        font-size: 15px;
      }
      .mosaic .tiles {
        gap: 3px;
      }
      .mosaic .habit {
        border-radius: 2px 12px 2px 2px;
        background: var(--paint);
        color: #211f1c;
        padding: 3px;
      }
      .mosaic .habit:nth-child(3n) {
        border-radius: 12px 2px 2px 2px;
      }
      .mosaic .habit:nth-child(4n) {
        border-radius: 2px 2px 12px 2px;
      }
      .mosaic .habit.done {
        box-shadow: inset 0 0 0 3px #fffcf0;
      }
      .mosaic .name {
        font-size: 9px;
        font-weight: 650;
      }
      .mosaic .tick {
        color: #211f1c;
        opacity: 0.65;
      }
      .mosaic .micro-progress {
        display: none;
      }
      /* 05: instrument panel, vivid phosphor, no decoration without a function. */
      .terminal {
        background: #071109;
        border: 1px solid #486a3c;
        border-radius: 6px;
        --color: #b9ed8b;
        --accent: #b9ed8b;
        padding: 7px;
        font-family: ui-monospace, monospace;
      }
      .terminal .widget-head {
        text-transform: uppercase;
        font-size: 11px;
        border-bottom: 1px dashed #68904d;
        padding-bottom: 5px;
        height: 24px;
      }
      .terminal .tiles {
        gap: 4px;
      }
      .terminal .habit {
        border: 1px solid #6c9b4d55;
        border-radius: 0;
        background: repeating-linear-gradient(
          0deg,
          #83cc6304 0px,
          #83cc6304 1px,
          transparent 1px,
          transparent 3px
        );
      }
      .terminal .habit.done {
        background: #b9ed8b;
        color: #0c170b;
      }
      .terminal .name {
        font-size: 8px;
        text-transform: uppercase;
      }
      .terminal .glyph svg {
        stroke-width: 1.5;
      }
      .terminal .tick {
        display: none;
      }
      .terminal .reward {
        display: block;
        position: absolute;
        top: 2px;
        right: 2px;
        font-size: 6px;
        opacity: 0.6;
      }
      .terminal .micro-progress {
        height: 2px;
        background: #294020;
      }
      /* 06: a ledger, warm paper, restrained marks. */
      .ledger {
        background: #f7f1df;
        color: #363329;
        border-radius: 7px;
        padding: 7px 12px;
        --accent: #b45a3e;
        box-shadow: 0 8px 18px #0003;
      }
      .ledger .widget-head {
        font-family: Georgia, serif;
        font-size: 16px;
        font-style: italic;
        height: 25px;
        border-bottom: 1px solid #c4b79b;
      }
      .ledger .tiles {
        gap: 0 5px;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        grid-template-rows: repeat(var(--ledger-rows), minmax(0, 1fr));
      }
      .ledger .habit {
        border-radius: 0;
        background: none;
        border-bottom: 1px solid #a89a7b50;
        flex-direction: row;
        justify-content: flex-start;
        gap: 4px;
      }
      .ledger .glyph {
        width: 15px;
        height: 15px;
      }
      .ledger .name {
        font:
          10px Georgia,
          serif;
      }
      .ledger .habit.done {
        color: #b45a3e;
        background: none;
      }
      .ledger .habit.done .name {
        text-decoration: line-through;
        text-decoration-thickness: 1px;
        text-decoration-color: #b45a3e88;
      }
      .ledger .tick {
        display: none;
      }
      .ledger .micro-progress {
        height: 2px;
        background: #c4b79b66;
      }
      /* 07: a translucent slab, restrained refraction and luminous outlines. */
      .glacier {
        color: #e2f9ff;
        background: linear-gradient(125deg, #badbf526, #51749125);
        border: 1px solid #c6edff60;
        border-radius: 22px;
        backdrop-filter: blur(22px);
        box-shadow:
          inset 0 1px 0 #fff6,
          0 10px 22px #06121b66;
        --accent: #bbecff;
      }
      .glacier .widget-head {
        font-size: 13px;
        text-shadow: 0 1px 5px #091721;
      }
      .glacier .habit {
        background: linear-gradient(140deg, #c7eaff15, #c7eaff06);
        border: 1px solid #d3eeff25;
        border-radius: 12px;
      }
      .glacier .habit.done {
        background: linear-gradient(140deg, #d3f8ff55, #6bb5cd30);
        box-shadow: inset 0 1px 0 #ffffff55;
      }
      .glacier .glyph svg {
        stroke-width: 1.5;
      }
      .glacier .name {
        color: #e2f9ff;
        font-size: 9px;
      }
      .glacier .tick {
        border-radius: 100%;
        border-color: #d3f8ff;
      }
      .glacier .habit.done .tick {
        background: #d3f8ff;
        color: #d3f8ff;
      }
      .glacier .micro-progress {
        bottom: 4px;
        left: 20px;
        right: 20px;
        height: 1px;
      }
      /* 08: an ink stamp on linen. */
      .linen {
        background: #e6e1d1;
        color: #38382f;
        border-radius: 13px;
        padding: 10px 13px;
        --accent: #ac6349;
      }
      .linen .widget-head {
        font:
          15px Georgia,
          serif;
        letter-spacing: 0.2px;
        border-bottom: 1px solid #bdb6a2;
        height: 25px;
        padding-bottom: 5px;
      }
      .linen .unit {
        font-size: 10px;
        font-style: italic;
      }
      .linen .tiles {
        gap: 3px;
      }
      .linen .habit {
        background: none;
        border-radius: 100% 100% 3px 3px;
      }
      .linen .glyph {
        color: #787a64;
      }
      .linen .habit.done .glyph {
        color: #ac6349;
      }
      .linen .habit.done:after {
        content: "";
        position: absolute;
        width: 4px;
        height: 4px;
        border-radius: 100%;
        bottom: 1px;
        background: #ac6349;
      }
      .linen .habit.done {
        background: none;
      }
      .linen .tick {
        display: none;
      }
      .linen .name {
        font:
          9px Georgia,
          serif;
      }
      .linen .micro-progress {
        height: 1px;
        bottom: 5px;
        left: 13px;
        right: 13px;
        background: #bdb6a2;
      }
      /* 09: cut-paper primary geometry. */
      .bauhaus {
        background: #e9dfc4;
        color: #1f2826;
        border-radius: 0;
        padding: 8px 8px 8px 15px;
        --accent: #bd4c3b;
      }
      .bauhaus:before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 6px;
        background: #d1a142;
      }
      .bauhaus .widget-head {
        font-weight: 800;
        font-family: Arial, sans-serif;
        letter-spacing: -0.6px;
        font-size: 16px;
      }
      .bauhaus .tiles {
        gap: 4px;
      }
      .bauhaus .habit {
        border-radius: 0;
        background: #1f282610;
      }
      .bauhaus .habit:nth-child(3n + 1) {
        border-radius: 100% 0 0 0;
      }
      .bauhaus .habit:nth-child(3n + 2) {
        border-radius: 0 0 100% 0;
      }
      .bauhaus .habit.done {
        background: #bd4c3b;
        color: #fff4d6;
      }
      .bauhaus .habit:nth-child(4n).done {
        background: #315c70;
      }
      .bauhaus .name {
        display: none;
      }
      .bauhaus .tick {
        display: none;
      }
      .bauhaus .micro-progress {
        height: 3px;
        background: #d1a142;
      }
      /* 10: a constellation around a shared daily total. */
      .orbit {
        padding: 0;
        background: radial-gradient(ellipse at center, #232a3c, #11141d 80%);
        border: 1px solid #707d9d44;
        border-radius: 25px;
        --color: #d9e1f1;
        --accent: #b6a9ec;
      }
      .orbit .widget-head {
        position: absolute;
        width: 94px;
        left: 50%;
        top: 50%;
        height: auto;
        transform: translate(-50%, -50%);
        justify-content: center;
        flex-direction: column;
        gap: 5px;
        pointer-events: none;
      }
      .orbit .total {
        text-align: center;
        font-size: 18px;
      }
      .orbit .unit {
        display: block;
        font-size: 8px;
        letter-spacing: 1px;
        text-transform: uppercase;
        margin-top: 4px;
      }
      .orbit .last {
        display: none;
      }
      .orbit .menu {
        display: none;
      }
      .orbit .tiles {
        display: block;
        position: absolute;
        inset: 0;
      }
      .orbit .habit {
        position: absolute;
        left: calc(50% + var(--x));
        top: calc(50% + var(--y));
        transform: translate(-50%, -50%);
        width: 29px;
        height: 29px;
        border: 1px solid #7d8baa66;
        border-radius: 100%;
        background: #1a2031;
        overflow: visible;
      }
      .orbit .habit .glyph {
        width: 16px;
        height: 16px;
      }
      .orbit .habit .name {
        display: none;
      }
      .orbit .habit.done {
        background: #b6a9ec;
        color: #171b2d;
        border-color: #b6a9ec;
        box-shadow: 0 0 11px #b6a9ec22;
      }
      .orbit .tick {
        display: none;
      }
      .orbit .micro-progress {
        display: none;
      }
      .orbit:before {

        inset: 17px 30px;
        border: 1px solid #899bc333;
        border-radius: 50%;
        pointer-events: none;

        content: "";
        position: absolute;
        inset: 30px 60px;
        border: 1px dashed #899bc326;
        border-radius: 50%;
        pointer-events: none;
      }

        padding-bottom: 5px;

      }

      }

        background: none;
        color: #e4a1bc;
      }

        bottom: 0;
        left: 30%;
        right: 30%;
        height: 1px;
        background: #e4a1bc;
      }
      .wire .glyph svg {
        stroke-width: 1.25;
      }
      .wire .name {
        font-size: 9px;
        opacity: 0.8;
      }
      .wire .tick {
        display: none;
      }
      .wire .micro-progress {
        height: 1px;
      }

      .editorial {
        background: #282327;
        color: #e7d6e1;
        border-radius: 15px;
        padding: 10px;
        gap: 0;
        flex-direction: row;
        --accent: #c7b4ef;
      }
      .editorial .widget-head {
        width: 73px;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
        padding-right: 9px;
        border-right: 1px solid #ceb9d433;
        gap: 7px;
        flex-shrink: 0;
      }
      .editorial .total {
        font-size: 24px;
        font-family: Georgia, serif;
        line-height: 0.95;
      }
      .editorial .total .today {
        display: block;
        font: 9px system-ui;
        margin-bottom: 7px;
        letter-spacing: 1px;
        text-transform: uppercase;
      }
      .editorial .unit {
        display: block;
        font: 9px system-ui;
        margin-top: 5px;
      }
      .editorial .menu {
        display: none;
      }
      .editorial .last {
        max-width: 66px;
        margin: 0;
        font-size: 8px;
        white-space: normal;
        line-height: 1.2;
      }
      .editorial .tiles {
        height: 100%;
        padding-left: 8px;
        grid-template-columns: repeat(var(--side-cols), minmax(0, 1fr));
        grid-template-rows: repeat(var(--side-rows), minmax(0, 1fr));
        gap: 4px;
      }
      .editorial .habit {
        background: #b6a0ca0d;
        border-radius: 6px;
      }
      .editorial .habit.done {
        color: #242029;
        background: #c5b4da;
      }
      .editorial .name {
        font-size: 8px;
      }
      .editorial .glyph {
        width: 17px;
        height: 17px;
      }
      .editorial .tick {
        display: none;
      }
      .editorial .micro-progress {
        height: 2px;
      }
      @media (max-width: 600px) {
        header {
          position: relative;
          padding: 12px;
        }
        .tools {
          gap: 10px;
        }
        .tools .push {
          margin-left: 0;
        }
        .gallery {
          padding: 16px 12px;
          gap: 22px;
        }
        .summary {
          padding: 12px 12px 0;
          flex-wrap: wrap;
          gap: 4px;
        }
        .stage {
          padding: 14px 5px;
        }
        .concept p {
          min-height: 0;
        }
        .heading small {
          font-size: 14px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          scroll-behavior: auto !important;
        }
      }

          const head = document.createElement("div");
          head.className = "concept-head";
          head.innerHTML = `<span class="num">${String(design + 1).padStart(2, "0")}</span><h2>${title}</h2>`;
          const save = document.createElement("button");
          save.className = "save";
          save.setAttribute("aria-label", "Favorite " + title);
          save.setAttribute("aria-pressed", favorites.has(id));
          save.innerHTML = svg("star");
          save.onclick = () => {
            favorites.has(id) ? favorites.delete(id) : favorites.add(id);
            try {
              localStorage.setItem(
                "uhabits2-grid-lab-favorites",
                JSON.stringify([...favorites]),
              );
            } catch {}
            render();
          };
          head.append(save);
          const stage = document.createElement("div");
          stage.className = "stage";
          const widget = document.createElement("section");
          widget.className = "widget " + id;
          widget.setAttribute("aria-label", title + " habit widget");
          widget.style.cssText = `--cols:${cols};--rows:${rows};--side-cols:${sideCols};--side-rows:${sideRows};--ledger-rows:${Math.ceil(count / 3)};--icon:${icon}px;--progress:${progress}%`;
          widget.innerHTML = `<div class="widget-head"><div class="total"><span class="today">Today </span><b>${total}</b><span class="unit"> points</span></div><div class="last" title="Last changed habit">${last}</div><div class="menu" aria-hidden="true"><i></i><i></i><i></i></div></div>`;
          const tiles = document.createElement("div");
          tiles.className = "tiles";
          active.forEach(([name, iconName, points], i) => {
            const button = document.createElement("button");
            button.className = "habit" + (done.has(i) ? " done" : "");
            button.setAttribute("aria-label", name + ", " + points + " points");
            button.setAttribute("aria-pressed", done.has(i));
            button.title = name + " · " + points + " points";
            const angle = (2 * Math.PI * i) / count - Math.PI / 2;
            button.style.cssText = `--paint:${paints[i % paints.length]};--x:${Math.cos(angle) * (width / 2 - 31)}px;--y:${Math.sin(angle) * (height / 2 - 24)}px`;
            button.innerHTML = `<span class="index">${String(i + 1).padStart(2, "0")}</span><span class="glyph">${svg(iconName)}</span><span class="name">${name}</span><span class="tick" aria-hidden="true"></span><span class="reward">${points}</span>`;
            button.onclick = () => {
              done.has(i) ? done.delete(i) : done.add(i);
              last = name;
              const focusDesign = id;
              render();
              document
                .querySelector(
                  "#" + focusDesign + " .habit:nth-child(" + (i + 1) + ")",
                )
                ?.focus({ preventScroll: true });
            };
            tiles.append(button);
          });
          widget.append(tiles);
          const bar = document.createElement("div");
          bar.className = "micro-progress";
          bar.setAttribute("aria-hidden", "true");
          bar.innerHTML = "<i></i>";
          widget.append(bar);
          stage.append(widget);
          const p = document.createElement("p");
          p.textContent = description;
          article.append(head, stage, p);
          gallery.append(article);
        });
        document.querySelector("#picked").textContent = favorites.size
          ? "Favorites: " +
            concepts
              .filter((c) => favorites.has(c[0]))
              .map((c) => c[1])
              .join(" · ")
          : "";
        document
          .querySelector("#favorites")
          .setAttribute("aria-pressed", onlyFavorites);
      }
      for (const id of ["width", "height", "count"])
        document.querySelector("#" + id).addEventListener("input", render);
      document.querySelector("#reset").onclick = () => {
        done = new Set();
        last = "";
        render();
      };
      document.querySelector("#favorites").onclick = () => {
        onlyFavorites = !onlyFavorites;
        render();
      };
      render();
    </script>
