<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pipeline explorer</title>
<style>
:root {
  color-scheme: dark;
  --bg: #100f0f;
  --bg2: #1c1b1a;
  --ui: #282726;
  --ui2: #343331;
  --ui3: #403e3c;
  --tx: #cecdc3;
  --tx2: #a6a39c;
  --cyan: #3aa99f;
  --blue: #4385be;
  --purple: #8b7ec8;
  --yellow: #d0a215;
  --orange: #da702c;
  --surface: #181716;
  --surface2: #151414;
  font: 15px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--tx);
}

* { box-sizing: border-box; }
body { margin: 0; height: 100dvh; overflow: hidden; }
button, input { font: inherit; }
button { cursor: pointer; }
button, input[type="search"] {
  border: 1px solid var(--ui2);
  border-radius: 6px;
  background: var(--bg2);
  color: var(--tx);
  padding: 7px 11px;
}
button:hover { border-color: var(--ui3); background: var(--ui); }
button:focus-visible, input:focus-visible, summary:focus-visible, a:focus-visible {
  outline: 2px solid var(--cyan);
  outline-offset: 3px;
}
header { height: 58px; border-bottom: 1px solid var(--ui); padding: 10px 18px; }
.top { height: 100%; display: flex; align-items: center; gap: 22px; }
.identity { font-size: 18px; white-space: nowrap; }
.identity strong { font-weight: 650; }
.segmented { display: flex; gap: 6px; }
.segmented button { background: var(--surface); border-color: var(--ui); font-size: 14px; }
.segmented button[aria-pressed="true"] {
  background: color-mix(in srgb, var(--cyan) 10%, var(--ui2));
  color: #8ed5cb;
  border-color: color-mix(in srgb, var(--cyan) 50%, var(--ui2));
  box-shadow: inset 0 -2px 0 var(--cyan);
}
.searchbox { position: relative; margin-left: auto; width: min(310px, 30vw); }
input[type="search"] { width: 100%; background: var(--surface); }
input::placeholder { color: var(--tx2); }
#searchResults {
  position: absolute; top: 44px; right: 0; z-index: 10;
  width: 460px; max-width: 90vw; max-height: 430px; overflow: auto;
  padding: 5px; border: 1px solid var(--ui2); border-radius: 6px;
  background: var(--bg2);
}
#searchResults:empty { display: none; }
#searchResults button { display: block; width: 100%; text-align: left; border: 0; font-size: 14px; }
#searchResults small { display: block; margin-top: 3px; color: var(--tx2); font-size: 12px; }

main {
  display: grid; grid-template-columns: minmax(0, 1fr) 410px; gap: 12px;
  height: calc(100dvh - 58px); padding: 14px;
}
.workspace { display: flex; flex-direction: column; gap: 10px; min-width: 0; min-height: 0; }
.stage-nav { display: flex; flex-wrap: wrap; gap: 6px; }
.stage-nav button {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 6px 9px; background: var(--surface); border-color: var(--ui); font-size: 14px;
}
.stage-nav small {
  display: inline-grid; place-items: center; flex: 0 0 auto;
  min-width: 23px; height: 23px; border-radius: 50%; padding: 0 4px;
  background: var(--ui2); color: var(--tx2); font-size: 12px; font-weight: 700;
}
.stage-nav button[aria-current="step"] {
  color: #8ed5cb; border-color: color-mix(in srgb, var(--cyan) 45%, var(--ui));
  background: color-mix(in srgb, var(--cyan) 7%, var(--surface));
}
.stage-nav button[aria-current="step"] small { background: var(--cyan); color: var(--bg); }
#canvas {
  position: relative; flex: 1; min-height: 0; overflow: hidden; touch-action: none;
  border: 1px solid var(--ui2); border-radius: 8px; background: #111;
}
#diagram { position: absolute; inset: 0; }
#diagram > svg { display: block; width: 100%; height: 100%; user-select: none; cursor: grab; }
#diagram > svg.dragging { cursor: grabbing; }
#diagram text { font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
#diagram .node { cursor: pointer; outline: none; }
#diagram .node:hover path, #diagram .node:hover polygon,
#diagram .node:focus-visible path, #diagram .node:focus-visible polygon { stroke-width: 2.7; }
#diagram .edge { cursor: pointer; transition: opacity .12s; }
#diagram .edge path { pointer-events: stroke; stroke-width: 2.2; vector-effect: non-scaling-stroke; }
#diagram .edge:hover path { stroke-width: 3.5; }
#diagram .node.muted { opacity: .45; }
#diagram .edge.muted { opacity: .16; }
#diagram .node.selected path, #diagram .node.selected polygon { stroke: #a1e1d6; stroke-width: 3; }
#diagram .edge.incoming path, #diagram .edge.incoming polygon { stroke: #72d5c8; fill: #72d5c8; stroke-width: 3; }
#diagram .edge.outgoing path, #diagram .edge.outgoing polygon { stroke: #c0a9ee; fill: #c0a9ee; stroke-width: 3; }
#diagram .edge.incoming path, #diagram .edge.outgoing path { fill: none; }
#diagram .edge.incoming text { fill: #9ee4da; }
#diagram .edge.outgoing text { fill: #d2bff7; }
#diagram .edge.selected path { stroke: #e9b65c; stroke-width: 3.5; }
#diagram .edge.selected polygon { stroke: #e9b65c; fill: #e9b65c; }
.tools {
  position: absolute; bottom: 12px; left: 12px; z-index: 2;
  display: flex; align-items: center; gap: 4px; padding: 4px;
  border: 1px solid var(--ui2); border-radius: 6px; background: var(--bg2);
}
.tools button { padding: 6px 9px; border-color: transparent; background: transparent; font-size: 14px; }
.tools button:hover { background: var(--ui); }
.tools span { min-width: 45px; text-align: center; font-size: 13px; color: var(--tx2); }
.tools .divider { width: 1px; min-width: 0; height: 20px; margin: 0 3px; background: var(--ui2); }
.map-wrap {
  position: absolute; right: 12px; bottom: 12px; z-index: 2;
  width: 190px; height: 100px; overflow: hidden;
  border: 1px solid var(--ui2); border-radius: 6px; background: var(--surface);
}
#minimap { display: block; width: 100%; height: 100%; cursor: crosshair; }
#minimap .viewport { fill: #3aa99f18; stroke: #72d5c8; stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.legend { display: flex; flex-wrap: wrap; gap: 16px; color: var(--tx2); font-size: 13px; padding: 0 2px; }
.key { display: inline-flex; align-items: center; gap: 6px; }
.swatch { width: 10px; height: 10px; border-radius: 2px; background: var(--cyan); }
.swatch.function { background: var(--purple); }
.swatch.context { background: var(--blue); }
.swatch.ref { background: var(--yellow); }
.swatch.file { background: var(--orange); }

aside {
  overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--ui3) transparent;
  padding: 20px; border: 1px solid var(--ui); border-radius: 8px; background: var(--surface);
}
aside h1 { margin: 9px 0 12px; font-size: 24px; line-height: 1.25; letter-spacing: -.025em; font-weight: 650; overflow-wrap: anywhere; }
aside h2 { margin: 24px 0 10px; font-size: 15px; font-weight: 650; }
aside p { margin: 10px 0; font-size: 15px; line-height: 1.6; }
.eyebrow { color: var(--tx2); font-size: 13px; }
.badge { display: inline-block; border: 1px solid var(--ui2); border-radius: 4px; padding: 3px 7px; font-size: 12px; color: #82cabc; }
.badge.function, .badge.stage { color: #b9a6e0; }
.badge.reference { color: #d9bd66; }
.badge.context { color: #8ab5dd; }
.badge.file { color: #e6a77a; }
.source-location { margin: 14px 0; color: var(--tx2); font: 13px/1.6 ui-monospace, SFMono-Regular, Consolas, monospace; overflow-wrap: anywhere; }
.note { padding: 10px 12px; margin: 12px 0; border-left: 2px solid var(--yellow); background: color-mix(in srgb, var(--yellow) 6%, transparent); font-size: 14px; line-height: 1.55; }
.fields { display: grid; gap: 6px; }
.fields code, .signature, pre {
  white-space: pre-wrap; overflow-wrap: anywhere; border: 1px solid var(--ui); border-radius: 6px;
  background: var(--surface2); color: var(--tx); font: 13px/1.65 ui-monospace, SFMono-Regular, Consolas, monospace;
}
.fields code { display: block; padding: 8px 10px; }
.signature { padding: 11px; }
.connection { display: block; width: 100%; text-align: left; margin: 6px 0; padding: 10px; background: var(--surface2); border-color: var(--ui); font-size: 14px; }
.connection strong { display: block; overflow-wrap: anywhere; font-weight: 600; }
.connection span { display: block; margin-top: 4px; color: var(--tx2); font-size: 13px; line-height: 1.5; }
.connection .arrow-in, .incoming-title { color: #72d5c8; }
.connection .arrow-out, .outgoing-title { color: #c0a9ee; }
.quick-jump { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 20px; }
.quick-jump button { padding: 7px 9px; font-size: 13px; }
details { margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--ui); }
summary { cursor: pointer; font-size: 14px; color: var(--tx2); }
summary:hover { color: var(--tx); }
pre { padding: 12px; max-height: 600px; overflow: auto; }
#clear { width: 100%; margin-top: 18px; font-size: 14px; }
.downloads { display: flex; gap: 18px; margin-top: 22px; }
.download { font-size: 13px; color: var(--cyan); text-decoration: none; }
.download:hover { text-decoration: underline; }

@media (max-width: 1100px) {
  main { grid-template-columns: minmax(0, 1fr) 340px; gap: 10px; padding: 10px; }
  aside { padding: 16px; }
  .stage-nav button { font-size: 13px; }
}
@media (max-width: 760px) {
  header { height: auto; padding: 10px; }
  .top { flex-wrap: wrap; gap: 8px; }
  .identity { width: 100%; }
  .searchbox { width: min(260px, 40vw); }
  main { height: calc(100dvh - 98px); grid-template-columns: minmax(0, 1fr) 290px; padding: 8px; gap: 8px; }
  .stage-nav { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; }
  .stage-nav button { flex-shrink: 0; }
  .map-wrap { width: 120px; height: 70px; bottom: 65px; }
  .tools { left: 6px; bottom: 6px; gap: 0; }
  .tools button { padding: 6px; }
  .legend { gap: 10px; font-size: 12px; }
}

</style>
</head>

<header>
  <div class="top">
    <div class="identity"><strong>Pipeline</strong></div>
    <div class="segmented" role="group" aria-label="Diagram detail level"><button data-view="stages" aria-pressed="true">Stages</button><button data-view="functions" aria-pressed="false">Major functions</button></div>

</main>

ed(settings)\n\n\twith stage_timer(timings, \"acquisition\"):\n\t\tacquired = data_acquisition_stage(settings)\n\n\twith stage_timer(timings, \"transformation\"):\n\t\ttransformed = transformation_stage(TransformationInput(run_id, acquired, transformation_settings))\n\n\twith stage_timer(timings, \"skeletonization\"):\n\t\tskeleton_context = InMemorySkeletonizationContext(transformed.features)\n\t\tsurface_artifact = make_surface_artifact(transformed.features, run_id)\n\t\tskeleton_output = skeletonization_stage(\n\t\t\tSkeletonizationInput(run_id, surface_artifact, skeletonization_settings),\n\t\t\tskeleton_context,\n\t\t)\n\n\twith stage_timer(timings, \"cleanup\"):\n\t\tcleanup_context = InMemorySkeletonizationCleanupContext(skeleton_context.centerlines)\n\t\tskeletonization_cleanup_stage(\n\t\t\tSkeletonizationCleanupInput(run_id, skeleton_output.centerline_artifact, cleanup_settings),\n\t\t\tcleanup_context,\n\t\t)\n\t\tcenterlines = cleanup_context.cleaned_centerlines\n\n\twith stage_timer(timings, \"graph_construction\"):\n\t\tgraph_context = InMemoryGraphContext(centerlines)\n\t\tgraph_output = graph_construction_stage(\n\t\t\tmake_graph_construction_input(centerlines, graph_settings, run_id=run_id),\n\t\t\tgraph_context,\n\t\t)\n\t\tgraph = graph_context.written_graph\n\t\tif graph is None:\n\t\t\traise RuntimeError(\"Graph construction did not write its graph artifact\")\n\n\t# Validation raises when the graph breaks the contract. Its findings are a subset of the ones\n\t# graph construction already found, so only the construction findings are kept.\n\twith stage_timer(timings, \"validation\"):\n\t\tvalidate_graph(graph, crs=transformed.crs, run=graph_output.run, settings=graph_settings)\n\n\treturn PipelineResult(\n\t\tdata_folder=data_folder,\n\t\tfeature_count=sum(len(batch.features) for batch in acquired.batches),\n\t\tsurface_count=len(transformed.features),\n\t\traw_centerline_count=len(skeleton_context.centerlines),\n\t\tcenterlines=centerlines,\n\t\tgraph=graph,\n\t\tqa_findings=skeleton_context.qa_findings + cleanup_context.qa_findings + graph.qa_findings,\n\t\tsettings={\n\t\t\t\"acquisition\": settings.model_dump(mode=\"json\"),\n\t\t\t\"transformation\": transformation_settings.model_dump(mode=\"json\"),\n\t\t\t\"skeletonization\": skeletonization_settings.model_dump(mode=\"json\"),\n\t\t\t\"skeletonization_cleanup\": cleanup_settings.model_dump(mode=\"json\"),\n\t\t\t\"graph_construction\": graph_settings.model_dump(mode=\"json\"),\n\t\t},\n\t)"}}, "acq_settings": {"id": "acq_settings", "label": "AcquisitionSettings", "kind": "model", "group": "acquisition", "role": "Selects the area, BGT layers, filters and cache refresh behavior.", "sub": "", "notes": [], "detailed": false, "source": {"path": "pipeline/contracts/models_acquisition.py", "line": 9, "doc": "Settings belonging to the acquisition stage.", "fields": ["region: str | None = Field(default=None, min_length=1)", "bbox: tuple[float, float, float, float] | None = None", "layers: list[str] = Field(default_factory=lambda: ['highway'], min_length=1)", "status: str | None = 'bestaand'", "functie: list[str] | None = Field(default_factory=lambda: list(SIDEWALK_FUNCTIE_VALUES))", "refresh: bool = False"], "signature": null, "code": "class AcquisitionSettings(BaseModel):\n\t\"\"\"Settings belonging to the acquisition stage.\"\"\"\n\n\tmodel_config = ConfigDict(extra=\"forbid\")\n\n\t# Exactly one of these must be set, so the whole country is never fetched by accident.\n\tregion: str | None = Field(default=None, min_length=1)\n\tbbox: tuple[float, float, float, float] | None = None\n\n\t# BGT collection names or the groups from LAYER_GROUPS. The pipeline reads the highway layer.\n\tlayers: list[str] = Field(default_factory=lambda: [\"highway\"], min_length=1)\n\tstatus: str | None = \"bestaand\"\n\n\t# Sidewalks only by default. Use None to keep every functie.\n\tfunctie: list[str] | None = Field(default_factory=lambda: list(SIDEWALK_FUNCTIE_VALUES))\n\n\t# Fetch again even when this request was fetched before.\n\trefresh: bool = False\n\n\t@model_validator(mode=\"after\")\n\tdef has_exactly_one_area(self):\n\t\tif (self.region is None) == (self.bbox is None):\n\t\t\traise ValueError(\"Give exactly one of region and bbox\")\n\t\tif self.bbox is not None and (self.bbox[0] >= self.bbox[2] or self.bbox[1] >= self.bbox[3]):\n\t\t\traise ValueError(\"Bounding-box minimums must be smaller than its maximums\")\n\t\treturn self\n\n\t@model_validator(mode=\"after\")\n\tdef includes_highway_layer(self):\n\t\tif \"highway\" not in self.layers:\n\t\t\traise ValueError(\"Layers must include highway, because the pipeline reads sidewalks from it\")\n\t\treturn self"}}, "acq": {"id": "acq", "label": "data_acquisition_stage()", "kind": "stage", "group": "acquisition", "role": "Reads cached BGT highway data into typed source records. With settings, it first ensures the cache exists.", "sub": "", "notes": ["run_stages() calls fetch_bgt_if_needed() separately for timing, then this function calls it again. With refresh=False the second call reuses the cache; refresh=True can fetch twice."], "detailed": false, "source": {"path": "pipeline/stages/acquisition.py", "line": 37, "doc": "Read the acquired BGT sidewalks from disk.\n\nRun pipeline_tools/acquire_bgt.py first (see docs/acquire_bgt.md) - this just reads\nwhatever it wrote to RAW_DATA_DIR.\n\nWith settings, the area is fetched from PDOK first, unless it was fetched before (see fetch_bgt_if_needed).", "fields": [], "signature": "data_acquisition_stage(settings: AcquisitionSettings | None=None) -> AcquisitionOutput", "code": "def data_acquisition_stage(settings: AcquisitionSettings | None = None) -> AcquisitionOutput:\n\t\"\"\"Read the acquired BGT sidewalks from disk.\n\n\tRun pipeline_tools/acquire_bgt.py first (see docs/acquire_bgt.md) - this just reads\n\twhatever it wrote to RAW_DATA_DIR.\n\n\tWith settings, the area is fetched from PDOK first, unless it was fetched before (see fetch_bgt_if_needed).\n\t\"\"\"\n\tpath = RAW_DATA_DIR / \"bgt_highway.gpkg\"\n\tif settings is not None:\n\t\tpath = fetch_bgt_if_needed(settings) / \"bgt_highway.gpkg\"\n\tif not path.exists():\n\t\traise FileNotFoundError(f\"{path} not found - run pipeline_tools/acquire_bgt.py first (see docs/acquire_bgt.md)\")\n\n\tbgt_features = read_bgt_layer(path, feature_type=\"wegdeel\")\n\n\treturn AcquisitionOutput(\n\t\tbatches=[\n\t\t\tAcquiredFeatureBatch(\n\t\t\t\tcrs=\"EPSG:28992\",\n\t\t\t\tsource_kind=SourceType.BGT,\n\t\t\t\tfeatures=bgt_features,\n\t\t\t),\n\t\t]\n\t)"}}, "fetch": {"id": "fetch", "label": "fetch_bgt_if_needed()", "kind": "function", "group": "acquisition", "role": "Returns a cache folder; downloads from PDOK when the request is absent or refresh is enabled.", "sub": "", "notes": [], "detailed": true, "source": {"path": "pipeline/stages/acquisition.py", "line": 567, "doc": "Return the folder with the BGT data for these settings, fetching it first when needed.", "fields": [], "signature": "fetch_bgt_if_needed(settings: AcquisitionSettings) -> Path", "code": "def fetch_bgt_if_needed(settings: AcquisitionSettings) -> Path:\n\t\"\"\"Return the folder with the BGT data for these settings, fetching it first when needed.\"\"\"\n\trequest = _fetch_request(settings)\n\tfolder = RAW_DATA_DIR / _folder_name(request)\n\n\t# Reuse an earlier fetch when its request matches, unless a refresh was asked for.\n\tinfo = None if settings.refresh else _read_fetch_info(folder, request, settings.layers)\n\tif info is not None:\n\t\tlogger.info(\"reusing BGT data in %s (fetched %s)\", folder, info[\"fetched_at\"])\n\telse:\n\t\tinfo = _fetch_into(folder, request, settings)\n\n\t# Warn about large areas, since the pipeline gets slow on them.\n\tfeature_count = info[\"feature_counts\"][\"highway\"]\n\tif feature_count > LARGE_FEATURE_COUNT_WARNING:\n\t\tlogger.warning(\"%d highway features, a pipeline run on this much data can take a while\", feature_count)\n\treturn folder"}}, "read_bgt": {"id": "read_bgt", "label": "read_bgt_layer()", "kind": "function", "group": "acquisition", "role": "Decodes a GeoPackage into BGTFeature records, including identity, lifecycle and relative height.", "sub": "", "notes": [], "detailed": true, "source": {"path": "pipeline/stages/acquisition.py", "line": 69, "doc": "Read one acquire_bgt.py output GeoPackage into BGTFeature records.", "fields": [], "signature": "read_bgt_layer(path: Path, feature_type: str) -> list[BGTFeature]", "code": "def read_bgt_layer(path: Path, feature_type: str) -> list[BGTFeature]:\n\t\"\"\"Read one acquire_bgt.py output GeoPackage into BGTFeature records.\"\"\"\n\tgdf = gpd.read_file(path)\n\tfeatures = []\n\n\tfor _, row in gdf.iterrows():\n\t\tprops = {str(key): _clean(value) for key, value in row.items() if key != \"geometry\"}\n\n\t\ttermination_date = props.get(\"termination_date\")\n\t\trelative_height_raw = props.get(\"relatieve_hoogteligging\")\n\t\tsource_holder = props.get(\"bronhouder\")\n\n\t\tlifecycle = BGTLifecycle(\n\t\t\tstatus=BGTStatus(str(props[\"status\"])),\n\t\t\tobject_begin_time=datetime.fromisoformat(str(props[\"creation_date\"])),\n\t\t\tobject_end_time=datetime.fromisoformat(str(termination_date)) if termination_date else None,\n\t\t)\n\n\t\tfeatures.append(\n\t\t\tBGTFeature(\n\t\t\t\tidentifier=BGTIdentifier(namespace=\"NL.IMGeo\", local_id=str(props[\"lokaal_id\"])),\n\t\t\t\tfeature_type=str(props.get(\"bgt_collection\", feature_type)),\n\t\t\t\tgeometry=row.geometry,\n\t\t\t\tlifecycle=lifecycle,\n\t\t\t\t# isinstance, not `is not None`/truthy - 0 (ground level) is a real, common\n\t\t\t\t# value, and geopandas upcasts this column to float when any feature in the\n\t\t\t\t# layer lacks it, so a present value can be a float (int(str(1.0)) raises).\n\t\t\t\trelative_height=(int(relative_height_raw) if isinstance(relative_height_raw, int | float) else None),\n\t\t\t\tsource_holder=str(source_holder) if source_holder is not None else None,\n\t\t\t\tattributes=props,\n\t\t\t)\n\t\t)\n\n\treturn features"}}, "bgt_cache": {"id": "bgt_cache", "label": "BGT cache \u00b7 GeoPackage", "kind": "file", "group": "acquisition", "role": "Actual files written by acquisition: bgt_highway.gpkg and request.json under pipeline/data/raw/\u003crequest>/.", "sub": "disk \u00b7 EPSG:28992", "notes": [], "detailed": false, "source": null}, "bgt": {"id": "bgt", "label": "BGTFeature", "kind": "model", "group": "acquisition", "role": "Source-specific records before normalization. The standard runner currently reads BGT, although the batch type also permits OSMFeature.", "sub": "", "notes": [], "detailed": true, "source": {"path": "pipeline/contracts/models_bgt.py", "line": 34, "doc": "BGT object after source decoding but before domain normalization.\n\nFeature-specific properties remain in ``attributes`` because the fields of,\nfor example, a wegdeel and a waterdeel are intentionally not identical.\nGeometry is expected to have been linearized, repaired where necessary,\nand assigned the BGT coordinate reference system (EPSG:28992).", "fields": ["identifier: BGTIdentifier", "feature_type: str", "geometry: BaseGeometry", "lifecycle: BGTLifecycle", "attributes: dict[str, object]", "relative_height: int | None = None", "source_holder: str | None = None"], "signature": null, "code": "class BGTFeature:\n\t\"\"\"BGT object after source decoding but before domain normalization.\n\n\tFeature-specific properties remain in ``attributes`` because the fields of,\n\tfor example, a wegdeel and a waterdeel are intentionally not identical.\n\tGeometry is expected to have been linearized, repaired where necessary,\n\tand assigned the BGT coordinate reference system (EPSG:28992).\n\t\"\"\"\n\n\tidentifier: BGTIdentifier\n\tfeature_type: str\n\tgeometry: BaseGeometry\n\tlifecycle: BGTLifecycle\n\tattributes: dict[str, object]\n\trelative_height: int | None = None\n\tsource_holder: str | None = None"}}, "bgt_id": {"id": "bgt_id", "label": "BGTIdentifier", "kind": "model", "group": "acquisition", "role": "Namespaced identity of one source BGT object.", "sub": "", "notes": [], "detailed": true, "source": {"path": "pipeline/contracts/models_bgt.py", "line": 9, "doc": "Namespaced identifier assigned to a BGT object.", "fields": ["namespace: str", "local_id: str"], "signature": null, "code": "class BGTIdentifier:\n\t\"\"\"Namespaced identifier assigned to a BGT object.\"\"\"\n\n\tnamespace: str\n\tlocal_id: str"}}, "bgt_life": {"id": "bgt_life", "label": "BGTLifecycle", "kind": "model", "group": "acquisition", "role": "Source status and beginning/end timestamps.", "sub": "", "notes": [], "detailed": true, "source": {"path": "pipeline/contracts/models_bgt.py", "line": 25, "doc": "Lifecycle information used to distinguish current BGT objects.", "fields": ["status: BGTStatus", "object_begin_time: datetime", "object_end_time: datetime | None = None"], "signature": null, "code": "class BGTLifecycle:\n\t\"\"\"Lifecycle information used to distinguish current BGT objects.\"\"\"\n\n\tstatus: BGTStatus\n\tobject_begin_time: datetime\n\tobject_end_time: datetime | None = None"}}, "batch": {"id": "batch", "label": "AcquiredFeatureBatch", "kind": "model", "group": "acquisition", "role": "Groups source records with their CRS and source kind.", "sub": "", "notes": [], "detailed": true, "source": {"path": "pipeline/contracts/stage_contracts.py", "line": 14, "doc": "", "fields": ["crs: str", "source_kind: SourceType", "features: Sequence[BGTFeature | OSMFeature]"], "signature": null, "code": "class AcquiredFeatureBatch:\n\tcrs: str\n\tsource_kind: SourceType\n\n\t# can't be list, since list is mutable.\n\t# if the contract accepted list[BGTFeature] as list[BGTFeature | OSMFeature], downstream code could append an OSM feature into the caller's BGT-only list\n\t# python's type system prevents that.\n\t# a read-only Sequence does not permit appending, so its element type can safely be covariant.\n\tfeatures: Sequence[BGTFeature | OSMFeature]"}}, "acq_out": {"id": "acq_out", "label": "AcquisitionOutput", "kind": "model", "group": "acquisition", "role": "The real return value: source feature batches, containing their data directly.", "sub": "batches \u2192 source records", "notes": [], "detailed": false, "source": {"path": "pipeline/contracts/stage_contracts.py", "line": 26, "doc": "", "fields": ["batches: list[AcquiredFeatureBatch]"], "signature": null, "code": "class AcquisitionOutput:\n\tbatches: list[AcquiredFeatureBatch]"}}, "trans_input": {"id": "trans_input", "label": "TransformationInput", "kind": "model", "group": "transformation", "role": "Wraps AcquisitionOutput, run_id and TransformationSettings for a direct in-memory call.", "sub": "", "notes": [], "detailed": false, "source": {"path": "pipeline/contracts/models_transformation.py", "line": 36, "doc": "Trusted input passed to the transformation stage.", "fields": ["run_id: str", "acquisition: AcquisitionOutput", "settings: TransformationSettings"], "signature": null, "code": "class TransformationInput:\n\t\"\"\"Trusted input passed to the transformation stage.\"\"\"\n\n\trun_id: str\n\tacquisition: AcquisitionOutput\n\tsettings: TransformationSettings\n\n\tdef __post_init__(self) -> None:\n\t\tif not self.run_id:\n\t\t\traise ValueError(\"run_id must not be empty\")"}}, "trans_settings": {"id": "trans_settings", "label": "TransformationSettings", "kind": "model", "group": "transformation", "role": "Defaults: merge nearby same-source/same-level surfaces; geometry simplification disabled.", "sub": "", "notes": [], "detailed": true, "source": {"path": "pipeline/contracts/models_transformation.py", "line": 14, "doc": "Settings belonging to the transformation stage.", "fields": ["run_simplify_geometry: bool = False", "run_merge_nearby_surfaces: bool = True", "resolution: float = Field(default=0.2, gt=0, allow_inf_nan=False)", "merge_distance: float = Field(default=0.5, gt=0, allow_inf_nan=False)"], "signature": null, "code": "class Transformatio NodeKind\n\tdegree: int\n\tattributes: dict[str, object] = field(default_factory=dict)\n\n\t# Manual additions have patch provenance instead of generated source records.\n\tcreating_patch_id: str | None = None\n\n\tdef __post_init__(self) -> None:\n\t\tself.validate()\n\n\tdef validate(self) -> None:\n\t\t\"\"\"Check node fields, including changes made after construction.\"\"\"\n\t\tif not self.node_id:\n\t\t\traise ValueError(\"node_id must not be empty\")\n\n\t\t# we're either creating from centerlines, or from a patch\n\t\tif self.creating_patch_id is not None:\n\t\t\tif self.creating_patch_id == \"\":\n\t\t\t\traise ValueError(\"creating_patch_id must not be empty\")\n\t\telse:\n\t\t\tif not self.source_centerline_ids:\n\t\t\t\traise ValueError(\"source_centerline_ids must not be empty\")\n\n\t\tif self.degree \u003c 0:\n\t\t\traise ValueError(\"degree must not be negative\")\n\t\tvalidate_coordinate(self.coordinate)"}}, "graph_edges": {"id": "graph_edges", "label": "GraphEdge", "kind": "model", "group": "construction", "role": "A graph connection: endpoint IDs, LineString geometry, level, routing attributes and source/patch provenance.", "sub": "", "notes": [], "detailed": true, "source": {"path": "pipeline/contracts/models.py", "line": 169, "doc": "connection between graph nodes with routing and accessibility attributes.", "fields": ["edge_id: str", "from_node_id: str", "to_node_id: str", "geometry: LineString", "relative_level: int", "source_centerline_ids: list[str]", "source_feature_ids: list[str]", "centerline_origins: list[CenterlineOrigin]", "attributes: dict[str, object] = field(default_factory=dict)", "creating_patch_id: str | None = None"], "signature": null, "code": "class GraphEdge:\n\t\"\"\"connection between graph nodes with routing and accessibility attributes.\"\"\"\n\n\tedge_id: str\n\tfrom_node_id: str\n\tto_node_id: str\n\tgeometry: LineString\n\trelative_level: int\n\tsource_centerline_ids: list[str]\n\tsource_feature_ids: list[str]\n\tcente ogram and QA count. Stored on GraphBuild and copied into GraphConstructionOutput.", "sub": "derived counts \u00b7 no geometry", "notes": [], "detailed": false, "source": {"path": "pipeline/contracts/models.py", "line": 225, "doc": "Small derived counts describing a constructed graph.", "fields": ["node_count: int", "edge_count: int", "component_count: int", "degree_histogram: dict[str, int]", "qa_count: int"], "signature": null, "code": "class GraphSummary:\n\t\"\"\"Small derived counts describing a constructed graph.\"\"\"\n\n\tnode_count: int\n\tedge_count: int\n\tcomponent_count: int\n\tdegree_histogram: dict[str, int]\n\tqa_count: int\n\n\tdef __post_init__(self) -> None:\n\t\tcounts = (self.node_count, self.edge_count, self.component_count, self.qa_count)\n\t\tif any(count \u003c 0 for count in counts):\n\t\t\traise ValueError(\"Graph summary counts must not be negative\")\n\t\tif any(count \u003c 0 for count in self.degree_histogram.values()):\n\t\t\traise ValueError(\"Degree histogram counts must not be negative\")"}}, "qa": {"id": "qa", "label": "QAFinding", "kind": "model", "group": "validation", "role": "A reviewable observation with stage/run identity, severity, message and optional feature IDs/location. Several stages produce lists of these.", "sub": "shared QA record", "notes": [], "detailed": true, "source": {"path": "pipeline/contracts/models.py", "line": 286, "doc": "A reviewable observation associated with a pipeline run and stage.\n\nStorage can deduplicate findings by run, stage, type, and related feature IDs.", "fields": ["finding_type: str", "severity: FindingSeverity", "message: str", "stage: PipelineStage", "run: GenerationRun", "coordinate: Coordinate | None = None", "related_feature_ids: list[str] | None = None", "details: dict[str, QAFindingDetail] | None = None"], "signature": null, "code": "class QAFinding:\n\t\"\"\"A reviewable observation associated with a pipeline run and stage.\n\n\tStorage can deduplicate findings by run, stage, type, and related feature IDs.\n\t\"\"\"\n\n\tfinding_type: str  # Keep codes open until the validation UI defines which values need dedicated presentation.\n\tseverity: FindingSeverity\n\tmessage: str\n\tstage: PipelineStage\n\trun: GenerationRun\n\tcoordinate: Coordinate | None = None\n\trelated_feature_ids: list[str] | None = None\n\t# Keep measurements separate from display text so code never needs to parse the message.\n\tdetails: dict[str, QAFindingDetail] | None = None"}}, "normalize": {"id": "normalize", "label": "normalize_closed_loops()", "kind": "function", "group": "construction", "role": "Canonicalizes loop anchors and orientation before comparing duplicate geometry.", "sub": "", "notes": [], "detailed": true, "source": {"path": "pipeline/stages/graph_construction.py", "line": 290, "doc": "Return closed lines rotated and oriented around a deterministic anchor.", "fields": [], "signature": "normalize_closed_loops(centerlines: list[Centerline]) -> list[Centerline]", "code": "def normalize_closed_loops(centerlines: list[Centerline]) -> list[Centerline]:\n\t\"\"\"Return closed lines rotated and oriented around a deterministic anchor.\"\"\"\n\tnormalized_centerlines = []\n\tfor centerline in centerlines:\n\t\tcoordinates = tuple(centerline.coordinates)\n\t\tif coordinates[0] != coordinates[-1]:\n\t\t\tnormalized_centerlines.append(centerline)\n\t\t\tcontinue\n\n\t\t# Remove the repeated closing coordinate before comparing cyclic orders.\n\t\tring = coordinates[:-1]\n\t\tforward_rotations = [ring[index:] + ring[:index] for index in range(len(ring))]\n\t\treversed_ring = tuple(reversed(ring))\n\t\treverse_rotations = [reversed_ring[index:] + reversed_ring[:index] for index in range(len(reversed_ring))]\n\n\t\t# The smallest cyclic ordering fixes both the anchor and traversal direction.\n\t\tcanonical_ring = min(*forward_rotations, *reverse_rotations)\n\t\tcanonical_coordinates = [*canonical_ring, canonical_ring[0]]\n\t\tnormalized_centerlines.append(replace(centerline, coordinates=canonical_coordinates))\n\n\treturn normalized_centerlines"}}, "deduplicate": {"id": "deduplicate", "label": "process_exact_duplicates()", "kind": "function", "group": "construction", "role": "Represents identical same-level lines once and records their provenance groups.", "sub": "", "notes": [], "detailed": true, "source": {"path": "pipeline/stages/graph_construction.py", "line": 351, "doc": "Represent exact same-level undirected geometries once and retain provenance.", "fields": [], "signature": "process_exact_duplicates(centerlines: list[Centerline]) -> DuplicateProcessingResult", "code": "def process_exact_duplicates(\n\tcenterlines: list[Centerline],\n) -> DuplicateProcessingResult:\n\t\"\"\"Represent exact same-level undirected geometries once and retain provenance.\"\"\"\n\t# Group coordinates independently of direction while keeping levels separate.\n\tgroups = {}\n\tfor centerline in centerlines:\n\t\tcoordinates = tuple(centerline.coordinates)\n\t\tundirected_coordinates = min(coordinates, tuple(reversed(coordinates)))\n\t\tkey = (centerline.relative_level, undirected_coordinates)\n\t\tgroups.setdefault(key, []).append(centerline)\n\n\t# Retain the lowest-ID line as each group's deterministic representative.\n\tretained_centerlines = []\n\tmerges = []\n\tfor group in groups.values():\n\t\tordered_group = sorted(group, key=lambda item: item.centerline_id)\n\t\trepresentative = ordered_group[0]\n\t\tretained_centerlines.append(representative)\n\n\t\tif len(ordered_group) == 1:\n\t\t\tcontinue\n\n\t\t# Capture all source provenance and a location for the later QA finding.\n\t\tmidpoint = LineString(representative.coordinates).interpolate(\n\t\t\t0.5,\n\t\t\tnormalized=True,\n\t\t)\n\t\tmerges.append(\n\t\t\tDuplicateMerge(\n\t\t\t\trepresentative_id=representative.centerline_id,\n\t\t\t\tcenterline_ids=tuple(centerline.centerline_id for centerline in ordered_group),\n\t\t\t\tsource_feature_ids=tuple(\n\t\t\t\t\tsorted({source_id for centerline in ordered_group for source_id in centerline.source_feature_ids})\n\t\t\t\t),\n\t\t\t\tcenterline_origins=tuple(sorted({centerline.centerline_origin for centerline in ordered_group})),\n\t\t\t\tcoordinate=coord_2d(midpoint.coords[0]),\n\t\t\t)\n\t\t)\n\n\t# Keep graph and QA output ordering stable when input centerlines are shuffled.\n\tretained_centerlines.sort(\n\t\tkey=lambda centerline: (\n\t\t\tcenterline.centerline_id,\n\t\t\tcenterline.relative_level,\n\t\t\ttuple(centerline.coordinates),\n\t\t)\n\t)\n\tmerges.sort(key=lambda merge: merge.representative_id)\n\n\treturn DuplicateProcessingResult(\n\t\tcenterlines=retained_centerlines,\n\t\tmerges=merges,\n\t)"}}, "split": {"id": "split", "label": "split_at_same_level_intersections()", "kind": "function", "group": "construction", "role": "Splits centerlines at crossings and overlap boundaries on the same level.", "sub": "", "notes": [], "detailed": true, "source": {"path": "pipeline/stages/graph_construction.py", "line": 162, "doc": "Split lines at same-level crossings and overlap boundaries.", "fields": [], "signature": "split_at_same_level_intersections(centerlines: list[Centerline]) -> list[Centerline]", "code": "def split_at_same_level_intersections(\n\tcenterlines: list[Centerline],\n) -> list[Centerline]:\n\t\"\"\"Split lines at same-level crossings and overlap boundaries.\"\"\"\n\tprepared_lines: list[_PreparedCenterline] = []\n\tfor centerline in centerlines:\n\t\tprepared_lines.append(\n\t\t\t_PreparedCenterline(\n\t\t\t\tsource=centerline,\n\t\t\t\tgeometry=to_linestring(centerline),\n\t\t\t\tsplit_coordinates=set(),\n\t\t\t)\n\t\t)\n\n\tfor left_index, right_index in _nearby_line_pairs([item.geometry for item in prepared_lines]):\n\t\tleft = prepared_lines[left_index]\n\t\tright = prepared_lines[right_index]\n\t\tif left.source.relative_level != right.source.relative_level:\n\t\t\tcontinue\n\n\t\tintersection = left.geometry.intersection(right.geometry)\n\t\tfor point in _intersection_split_points(intersection):\n\t\t\tcoordinate = coord_2d(point.coords[0])\n\t\t\t_add_interior_split_coordinate(left, coordinate)\n\t\t\t_add_interior_split_coordinate(right, coordinate)\n\n\tresulting_lines: list[Centerline] = []\n\tfor prepared_line in prepared_lines:\n\t\tpiece_geometries = split_linestring_at_coordinates(\n\t\t\tprepared_line.geometry,\n\t\t\tprepared_line.split_coordinates,\n\t\t)\n\t\tfor piece_geometry in piece_geometries:\n\t\t\tcoordinates = coordinates_2d(piece_geometry.coords)\n\t\t\tresulting_lines.append(replace(prepared_line.source, coordinates=coordinates))\n\n\treturn resulting_lines"}}, "build_records": {"id": "build_records", "label": "build_graph_from_pieces()", "kind": "function", "group": "construction", "role": "Converts centerline pieces to level-aware GraphNode and GraphEdge records.", "sub": "", "notes": [], "detailed": true, "source": {"path": "pipeline/stages/graph_construction.py", "line": 220, "doc": "Build level-aware nodes and edge records from split centerline pieces.", "fields": [], "signature": "build_graph_from_pieces(pieces: list[Centerline]) -> tuple[dict[NodeKey, GraphNode], list[GraphEdge]]", "code": "def build_graph_from_pieces(\n\tpieces: list[Centerline],\n) -> tuple[dict[NodeKey, GraphNode], list[GraphEdge]]:\n\t\"\"\"Build level-aware nodes and edge records from split centerline pieces.\"\"\"\n\tnode_details = {}\n\tedges: list[GraphEdge] = []\n\n\t# Create the edges and collect the information needed for their endpoint nodes.\n\tfor piece in pieces:\n\t\tcoordinates = piece.coordinates\n\t\trelative_level = piece.relative_level\n\t\tstart = node_key(coordinates[0], relative_level)\n\t\tend = node_key(coordinates[-1], relative_level)\n\n\t\tedges.append(\n\t\t\tGraphEdge(\n\t\t\t\tedge_id=_edge_id(\n\t\t\t\t\tcoordinates,\n\t\t\t\t\trelative_level,\n\t\t\t\t\tpiece.centerline_id,\n\t\t\t\t),\n\t\t\t\tfrom_node_id=_node_id(start),\n\t\t\t\tto_node_id=_node_id(end),\n\t\t\t\t# Keep every coordinate so bends remain part of the edge without\n\t\t\t\t# incorrectly becoming graph nodes.\n\t\t\t\tgeometry=LineString(coordinates),\n\t\t\t\trelative_level=relative_level,\n\t\t\t\tsource_centerline_ids=[piece.centerline_id],\n\t\t\t\tsource_feature_ids=piece.source_feature_ids,\n\t\t\t\tcenterline_origins=[piece.centerline_origin],\n\t\t\t)\n\t\t)\n\n\t\t# Create each endpoint node the first time it appears, then update its details.\n\t\tfor key, coordinate in ((start, coordinates[0]), (end, coordinates[-1])):\n\t\t\tdetails = node_details.setdefault(\n\t\t\t\tkey,\n\t\t\t\t{\n\t\t\t\t\t\"coordinate\": coordinate,\n\t\t\t\t\t\"relative_level\": relative_level,\n\t\t\t\t\t\"degree\": 0,\n\t\t\t\t\t\"source_centerline_ids\": set(),\n\t\t\t\t\t\"has_self_loop\": False,\n\t\t\t\t},\n\t\t\t)\n\t\t\tdetails[\"degree\"] += 1\n\t\t\tdetails[\"source_centerline_ids\"].add(piece.centerline_id)\n\t\t\tif start == end:\n\t\t\t\tdetails[\"has_self_loop\"] = True\n\n\t# Create the final node records once their degrees and sources are known.\n\tnodes_by_coordinate = {}\n\tfor key, details in node_details.items():\n\t\tnode_kind = _node_kind(\n\t\t\tdetails[\"degree\"],\n\t\t\tlen(details[\"source_centerline_ids\"]),\n\t\t\tdetails[\"has_self_loop\"],\n\t\t)\n\t\tnodes_by_coordinate[key] = GraphNode(\n\t\t\tnode_id=_node_id(key),\n\t\t\tcoordinate=details[\"coordinate\"],\n\t\t\trelative_level=details[\"relative_level\"],\n\t\t\tnode_kind=node_kind,\n\t\t\tdegree=details[\"degree\"],\n\t\t\tsource_centerline_ids=sorted(details[\"source_centerline_ids\"]),\n\t\t)\n\n\treturn nodes_by_coordinate, edges"}}, "provenance": {"id": "provenance", "label": "apply_duplicate_provenance()", "kind": "function", "group": "construction", "role": "Adds source provenance from merged duplicate centerlines to the graph records.", "sub": "", "notes": [], "detailed": true, "source": {"path": "pipeline/stages/graph_construction.py", "line": 407, "doc": "Add the source information from merged duplicate centerlines to the graph.", "fields": [], "signature": "apply_duplicate_provenance(graph_build: GraphBuild, duplicate_result: DuplicateProcessingResult) -> GraphBuild", "code": "def apply_duplicate_provenance(\n\tgraph_build: GraphBuild,\n\tduplicate_result: DuplicateProcessingResult,\n) -> GraphBuild:\n\t\"\"\"Add the source information from merged duplicate centerlines to the graph.\"\"\"\n\t# Look up each group of duplicates by the centerline that was kept in the graph.\n\tmerges_by_representative = {merge.representative_id: merge for merge in duplicate_result.merges}\n\n\t# Add the source information from every duplicate to each affected edge.\n\tedges = []\n\tfor edge in graph_build.edges:\n\t\tmerge = next(\n\t\t\t(\n\t\t\t\tmerges_by_representative[centerline_id]\n\t\t\t\tfor centerline_id in edge.source_centerline_ids\n\t\t\t\tif centerline_id in merges_by_representative\n\t\t\t),\n\t\t\tNone,\n\t\t)\n\t\tif merge is None:\n\t\t\tedges.append(edge)\n\t\t\tcontinue\n\n\t\tedges.append(\n\t\t\treplace(\n\t\t\t\tedge,\n\t\t\t\tsource_centerline_ids=list(merge.centerline_ids),\n\t\t\t\tsource_feature_ids=list(merge.source_feature_ids),\n\t\t\t\tcenterline_origins=list(merge.centerline_origins),\n\t\t\t)\n\t\t)\n\n\t# Add the duplicate centerline IDs to each affected node as well.\n\tnodes = []\n\tfor node in graph_build.nodes:\n\t\texpanded_ids = set(node.source_centerline_ids)\n\t\tfor centerline_id in node.source_centerline_ids:\n\t\t\tmerge = merges_by_representative.get(centerline_id)\n\t\t\tif merge is not None:\n\t\t\t\texpanded_ids.update(merge.centerline_ids)\n\t\tnodes.append(replace(node, source_centerline_ids=sorted(expanded_ids)))\n\n\treturn replace(graph_build, nodes=nodes, edges=edges)"}}, "crossing_qa": {"id": "crossing_qa", "label": "build_level_separated_crossing_findings()", "kind": "function", "group": "construction", "role": "Reports 2D crossings intentionally left disconnected because levels differ.", "sub": "", "notes": [], "detailed": true, "source": {"path": "pipeline/stages/graph_construction.py", "line": 313, "doc": "Report crossings that stay disconnected because their levels differ.", "fields": [], "signature": "build_level_separated_crossing_findings(centerlines: list[Centerline], qa_ctx: QAContext) -> list[QAFinding]", "code": "def build_level_separated_crossing_findings(\n\tcenterlines: list[Centerline],\n\tqa_ctx: QAContext,\n) -> list[QAFinding]:\n\t\"\"\"Report crossings that stay disconnected because their levels differ.\"\"\"\n\tfindings = []\n\tgeometries = [to_linestring(centerline) for centerline in centerlines]\n\tfor left_index, right_index in _nearby_line_pairs(geometries):\n\t\tleft = centerlines[left_index]\n\t\tright = centerlines[right_index]\n\t\tif left.relative_level == right.relative_level:\n\t\t\tcontinue\n\t\tintersection = geometries[left_index].intersection(geometries[right_index])\n\t\tfor point in _point_parts(intersection):\n\t\t\tfindings.append(\n\t\t\t\tqa_ctx.finding(\n\t\t\t\t\tfinding_type=\"graph.level_separated_crossing\",\n\t\t\t\t\tseverity=FindingSeverity.INFO,\n\t\t\t\t\tmessage=\"Lines cross in 2D but remain separate across physical levels.\",\n\t\t\t\t\trelated_feature_ids=list(\n\t\t\t\t\t\t_ordered_id_pair(\n\t\t\t\t\t\t\tleft.centerline_id,\n\t\t\t\t\t\t\tright.centerline_id,\n\t\t\t\t\t\t)\n\t\t\t\t\t),\n\t\t\t\t\tcoordinate=coord_2d(point.coords[0]),\n\t\t\t\t\tdetails={\n\t\t\t\t\t\t\"left_relative_level\": left.relative_level,\n\t\t\t\t\t\t\"right_relative_level\": right.relative_level,\n\t\t\t\t\t},\n\t\t\t\t)\n\t\t\t)\n\treturn sorted(\n\t\tfindings,\n\t\tkey=lambda finding: (finding.related_feature_ids or [], finding.coordinate),\n\t)"}}, "graph_qa": {"id": "graph_qa", "label": "build_qa_findings()", "kind": "function", "group": "construction", "role": "Collects graph topology/geometry findings, duplicate-merge findings and level-separated crossings.", "sub": "", "notes": [], "detailed": true, "source": {"path": "pipeline/stages/graph_construction.py", "line": 116, "doc": "Create the small, reviewable QA collection for a graph build.", "fields": [], "signature": "build_qa_findings(graph_build: GraphBuild, duplicate_result: DuplicateProcessingResult, construction_findings: list[QAFinding], qa_ctx: QAContext, settings: GraphConstructionSettings) -> list[QAFinding]", "code": "def build_qa_findings(\n\tgraph_build: GraphBuild,\n\tduplicate_result: DuplicateProcessingResult,\n\tconstruction_findings: list[QAFinding],\n\tqa_ctx: QAContext,\n\tsettings: GraphConstructionSettings,\n) -> list[QAFinding]:\n\t\"\"\"Create the small, reviewable QA collection for a graph build.\"\"\"\n\tfindings = build_graph_findings(\n\t\tgraph_build.nodes,\n\t\tgraph_build.edges,\n\t\tqa_ctx,\n\t\tsettings,\n\t)\n\n\t# Record each group of source lines represented by one graph geometry.\n\tfor merge in duplicate_result.merges:\n\t\tfindings.append(\n\t\t\tqa_ctx.finding(\n\t\t\t\tfinding_type=\"graph.duplicate_centerline_merged\",\n\t\t\t\tseverity=FindingSeverity.INFO,\n\t\t\t\tmessage=\"Merged exact duplicate centerlines and retained their source information.\",\n\t\t\t\trelated_feature_ids=list(merge.centerline_ids),\n\t\t\t\tcoordinate=merge.coordinate,\n\t\t\t\tdetails={\"representative_id\": merge.representative_id},\n\t\t\t)\n\t\t)\n\n\tfindings.extend(construction_findings)\n\n\treturn findings"}}, "duplicates": {"id": "duplicates", "label": "DuplicateProcessingResult", "kind": "model", "group": "construction", "role": "Carries representative centerlines plus duplicate merge groups used to preserve provenance and create QA.", "sub": "", "notes": [], "detailed": true, "source": {"path": "pipeline/stages/graph_construction.py", "line": 65, "doc": "", "fields": ["centerlines: list[Centerline]", "merges: list[DuplicateMerge]"], "signature": null, "code": "class DuplicateProcessingResult:\n\tcenterlines: list[Centerline]\n\tmerges: list[DuplicateMerge]"}}, "make_summary": {"id": "make_summary", "label": "build_graph_summary()", "kind": "function", "group": "construction", "role": "Derives node, edge, component and degree counts from the actual graph records.", "sub": "", "notes": [], "detailed": true, "source": {"path": "pipeline/util/graph_manipulation.py", "line": 20, "doc": "Count physical topology regardless of access; loops count twice toward degree.", "fields": [], "signature": "build_graph_summary(nodes: list[GraphNode], edges: list[GraphEdge], *, qa_count: int) -> GraphSummary", "code": "def build_graph_summary(nodes: list[GraphNode], edges: list[GraphEdge], *, qa_count: int) -> GraphSummary:\n\t\"\"\"Count physical topology regardless of access; loops count twice toward degree.\"\"\"\n\n\tnetwork = nx.MultiGraph()\n\tnetwork.add_nodes_from(node.node_id for node in nodes)\n\tnetwork.add_edges_from((edge.from_node_id, edge.to_node_id) for edge in edges)\n\treturn GraphSummary(\n\t\tnode_count=len(nodes),\n\t\tedge_count=len(edges),\n\t\tcomponent_count=nx.number_connected_components(network),\n\t\tdegree_histogram=dict(Counter(str(degree) for _, degree in network.degree())),\n\t\tqa_count=qa_count,\n\t)"}}, "validate": {"id": "validate", "label": "validate_graph()", "kind": "stage", "group": "validation", "role": "Checks CRS and derives topology/geometry findings for the generated graph. It does not modify the graph. run_stages() ignores the returned findings because construction already includes them.", "sub": "", "notes": [], "detailed": false, "source": {"path": "pipeline/validation_graph.py", "line": 148, "doc": "Validate a constructed graph before it is written to an artifact.", "fields": [], "signature": "validate_graph(graph: GraphBuild, crs: str, run: GenerationRun, settings: GraphConstructionSettings) -> list[QAFinding]", "code": "def validate_graph(\n\tgraph: GraphBuild,\n\tcrs: str,\n\trun: GenerationRun,\n\tsettings: GraphConstructionSettings,\n) -> list[QAFinding]:\n\t\"\"\"Validate a constructed graph before it is written to an artifact.\"\"\"\n\tif crs != \"EPSG:28992\":\n\t\traise PipelineContractError(f\"graph construction produced {crs}; expected EPSG:28992\")\n\n\treturn build_graph_findings(graph.nodes, graph.edges, QAContext(run, PipelineStage.GRAPH_CONSTRUCTION), settings)"}}, "pipeline_result": {"id": "pipeline_result", "label": "PipelineResult", "kind": "model", "group": "validation", "role": "Runner-level bundle: generated GraphBuild, cleaned centerlines, combined generation QA, source folder/counts and settings. This is not a stage contract.", "sub": "runner bundle \u00b7 actual data", "notes": [], "detailed": false, "source": {"path": "pipeline_tools/run_pipeline.py", "line": 58, "doc": "Everything a run produced.", "fields": ["data_folder: Path", "feature_count: int", "surface_count: int", "raw_centerline_count: int", "centerlines: list[Centerline]", "graph: GraphBuild", "qa_findings: list[QAFinding]", "settings: dict[str, Any]"], "signature": null, "code": "class PipelineResult:\n\t\"\"\"Everything a run produced.\"\"\"\n\n\tdata_folder: Path\n\tfeature_count: int\n\tsurface_count: int\n\traw_centerline_count: int\n\tcenterlines: list[Centerline]\n\tgraph: GraphBuild\n\tqa_findings: list[QAFinding]\n\tsettings: dict[str, Any]"}}, "combined_qa": {"id": "combined_qa", "label": "list[QAFinding] \u00b7 generation", "kind": "model", "group": "validation", "role": "Concatenation of skeletonization QA + cleanup QA + graph QA. Acquisition/transformation do not contribute QAFinding lists here.", "sub": "three generation QA streams", "notes": [], "detailed": false, "source": {"path": "pipeline/contracts/models.py", "line": 286, "doc": "A reviewable observation associated with a pipeline run and stage.\n\nStorage can deduplicate findings by run, stage, type, and related feature IDs.", "fields": ["finding_type: str", "severity: FindingSeverity", "message: str", "stage: PipelineStage", "run: GenerationRun", "coordinate: Coordinate | None = None", "related_feature_ids: list[str] | None = None", "details: dict[str, QAFindingDetail] | None = None"], "signature": null, "code": "class QAFinding:\n\t\"\"\"A reviewable observation associated with a pipeline run and stage.\n\n\tStorage can deduplicate findings by run, stage, type, and related feature IDs.\n\t\"\"\"\n\n\tfinding_type: str  # Keep codes open until the validation UI defines which values need dedicated presentation.\n\tseverity: FindingSeverity\n\tmessage: str\n\tstage: PipelineStage\n\trun: GenerationRun\n\tcoordinate: Coordinate | None = None\n\trelated_feature_ids: list[str] | None = None\n\t# Keep measurements separate from display text so code never needs to parse the message.\n\tdetails: dict[str, QAFindingDetail] | None = None"}}, "export": {"id": "export", "label": "write_outputs()", "kind": "stage", "group": "export", "role": "Called by run_pipeline.main() after run_stages(). Converts actual graph/centerline/QA records to GeoDataFrames and writes the standard generated-DWN files.", "sub": "", "notes": [], "detailed": false, "source": {"path": "pipeline_tools/run_pipeline.py", "line": 170, "doc": "Write the DWN as one GeoPackage, plus GeoJSON files for quick review.", "fields": [], "signature": "write_outputs(run_dir: Path, result: PipelineResult) -> None", "code": "def write_outputs(run_dir: Path, result: PipelineResult) -> None:\n\t\"\"\"Write the DWN as one GeoPackage, plus GeoJSON files for quick review.\"\"\"\n\tlayers = {\n\t\t\"edges\": edges_geodataframe(result.graph.edges),\n\t\t\"nodes\": nodes_geodataframe(result.graph.nodes),\n\t\t\"centerlines\": centerlines_geodataframe(result.centerlines),\n\t\t\"qa_findings\": qa_findings_geodataframe(result.qa_findings),\n\t}\n\twrite_geopackage(run_dir / \"dwn.gpkg\", layers)\n\tfor name in (\"edges\", \"nodes\", \"qa_findings\"):\n\t\twrite_geojson_wgs84(run_dir / f\"{name}.geojson\", layers[name])"}}, "frames": {"id": "frames", "label": "GeoDataFrame layers", "kind": "model", "group": "export", "role": "Export-only tabular geometry representation. Different from the domain models and ArtifactR ": "export", "role": "Collects source request, settings, counts, git commit and timings. main() serializes this dictionary to run.json.", "sub": "", "notes": [], "detailed": true, "source": {"path": "pipeline_tools/run_pipeline.py", "line": 183, "doc": "Collect the information that goes into run.json.", "fields": [], "signature": "build_run_info(run_id: str, started_at: datetime, region: str | None, area: tuple[float, float, float, float], result: PipelineResult, timings: dict[str, float]) -> dict[str, Any]", "code": "def build_run_info(\n\trun_id: str,\n\tstarted_at: datetime,\n\tregion: str | None,\n\tarea: tuple[float, float, float, float],\n\tresult: PipelineResult,\n\ttimings: dict[str, float],\n) -> dict[str, Any]:\n\t\"\"\"Collect the information that goes into run.json.\"\"\"\n\tfetch_info = json.loads((result.data_folder / FETCH_INFO_FILE).read_text(encoding=\"utf-8\"))\n\treturn {\n\t\t\"run_id\": run_id,\n\t\t\"started_at\": started_at.isoformat(timespec=\"seconds\"),\n\t\t\"git_commit\": git_commit(),\n\t\t\"area\": {\n\t\t\t\"region\": region,\n\t\t\t\"bbox\": list(area),\n\t\t\t\"area_km2\": round((area[2] - area[0]) * (area[3] - area[1]) / 1_000_000, 2),\n\t\t},\n\t\t\"source\": {\n\t\t\t\"folder\": str(result.data_folder),\n\t\t\t\"fetched_at\": fetch_info[\"fetched_at\"],\n\t\t\t\"feature_counts\": fetch_info[\"feature_counts\"],\n\t\t},\n\t\t\"settings\": result.settings,\n\t\t\"counts\": {\n\t\t\t\"acquired_features\": result.feature_count,\n\t\t\t\"surfaces\": result.surface_count,\n\t\t\t\"centerlines_before_cleanup\": result.raw_centerline_count,\n\t\t\t\"centerlines\": len(result.centerlines),\n\t\t\t\"nodes\": len(result.graph.nodes),\n\t\t\t\"edges\": len(result.graph.edges),\n\t\t\t\"qa_findings\": dict(Counter(finding.finding_type for finding in result.qa_findings)),\n\t\t},\n\t\t\"seconds\": timings,\n\t\t\"total_seconds\": round(sum(timings.values()), 1),\n\t}"}}, "patches": {"id": "patches", "label": "Patch", "kind": "model", "group": "corrections", "role": "An ordered list of patches is supplied by the caller. Each patch has a bbox, before/after snapshots, ordered operations, a validity period and provenance.", "sub": "ordered list \u00b7 saved JSON in demo", "notes": ["The Den Haag demo loads patches.json if present; otherwise author_patches() creates reviewed patches.", "There is no durable PostGIS patch store in this flow."], "detailed": false, "source": {"path": "pipeline/contracts/models_corrections.py", "line": 171, "doc": "One atomic correction with a validity period.", "fields": ["patch_id: str = Field(min_length=1)", "created_against_run: str = Field(min_length=1)", "target_region: BoundingBox", "expected_before: RegionState", "operations: list[PatchOperation] = Field(min_length=1)", "desired_after: RegionState", "valid_from: AwareDatetime", "expires_at: AwareDatetime | None = None", "message: str | None = None"], "signature": null, "code": "class Patch(PatchModel):\n\t\"\"\"One atomic correction with a validity period.\"\"\"\n\n\tpatch_id: str = Field(min_length=1)\n\tcreated_against_run: str = Field(min_length=1)\n\ttarget_region: BoundingBox\n\texpected_before: RegionState\n\toperations: list[PatchOperation] = Field(min_length=1)\n\tdesired_after: RegionState\n\tvalid_from: AwareDatetime\n\texpires_at: AwareDatetime | None = None\n\tmessage: str | None = None\n\n\t@model_validator(mode=\"after\")\n\tdef expiration_follows_start(self) -> Patch:\n\t\t\"\"\"Require expiry after activation.\"\"\"\n\t\tif self.expires_at is not None and self.expires_at \u003c= self.valid_from:\n\t\t\traise ValueError(\"expires_at must be later than valid_from\")\n\t\treturn self"}}, "replay": {"id": "replay", "label": "apply_patches()", "kind": "stage", "group": "corrections", "role": "Checks validity periods and replays active patches in saved order. Each patch is atomic; a failure produces QA and later patches are still attempted.", "sub": "", "notes": ["Called after run_stages() by demo_den_haag_hs.export_review(), and directly by synthetic demos.", "There are currently no CorrectionsInput / CorrectionsOutput stage envelopes or corrections storage context.", "Inputs are generated_dwn, patches, GenerationRun and timezone-aware replay time at.", "Rebuild from the generated graph after expiry/removal; there is no inverse edit.", "apply_patches() and apply_patch() share the private _replay_patch() implementation; apply_patches() does not call the public apply_patch() wrapper."], "detailed": false, "source": {"path": "pipeline/stages/corrections.py", "line": 425, "doc": "Apply active patches in list order, starting from the generated graph.\n\nIf a patch fails, discard its changes and try the next patch.\nRun again from ``generated_dwn`` when a patch expires, changes or is removed.", "fields": [], "signature": "apply_patches(generated_dwn: GraphBuild, patches: Sequence[Patch], run: GenerationRun, *, at: datetime) -> PatchSetResult", "code": "def apply_patches(generated_dwn: GraphBuild, patches: Sequence[Patch], run: GenerationRun, *, at: datetime) -> PatchSetResult:\n\t\"\"\"Apply active patches in list order, starting from the generated graph.\n\n\tIf a patch fails, discard its changes and try the next patch.\n\tRun again from ``generated_dwn`` when a patch expires, changes or is removed.\n\t\"\"\"\n\tpatch_ids: set[str] = set()\n\tfor patch in patches:\n\t\tif patch.patch_id in patch_ids:\n\t\t\traise ValueError(f\"Duplicate patch ID: {patch.patch_id}\")\n\t\tpatch_ids.add(patch.patch_id)\n\n\tif at.tzinfo is None or at.utcoffset() is None:\n\t\traise ValueError(\"Patch replay time must include a timezone\")\n\n\tvalidate_graph_records(generated_dwn.nodes, generated_dwn.edges)\n\n\teffective_dwn = generated_dwn\n\toutcomes: dict[str, PatchOutcome] = {}\n\tfindings: list[QAFinding] = []\n\tfor patch in patches:\n\t\tif at \u003c patch.valid_from:\n\t\t\toutcome = PatchOutcome.NOT_YET_ACTIVE\n\t\telif patch.expires_at is not None and at >= patch.expires_at:\n\t\t\toutcome = PatchOutcome.EXPIRED\n\t\telse:\n\t\t\toutcome, effective_dwn, patch_findings = _replay_patch(effective_dwn, patch, run)\n\t\t\tfindings.extend(patch_findings)\n\t\toutcomes[patch.patch_id] = outcome\n\n\treturn PatchSetResult(effective_dwn=effective_dwn, outcomes=outcomes, qa_findings=findings)"}}, "patch_result": {"id": "patch_result", "label": "PatchSetResult", "kind": "model", "group": "corrections", "role": "In-memory replay return value: effective_dwn: GraphBuild, outcomes keyed by patch ID, and correction QA findings.", "sub": "actual graph + outcomes + correction QA", "notes": [], "detailed": false, "source": {"path": "pipeline/contracts/models_corrections.py", "line": 42, "doc": "Effective DWN, ordered patch outcomes and correction QA.", "fields": ["effective_dwn: GraphBuild", "outcomes: dict[str, PatchOutcome]", "qa_findings: list[QAFinding]"], "signature": null, "code": "class PatchSetResult:\n\t\"\"\"Effective DWN, ordered patch outcomes and correction QA.\"\"\"\n\n\teffective_dwn: GraphBuild\n\toutcomes: dict[str, PatchOutcome]\n\tqa_findings: list[QAFinding]"}}, "effective": {"id": "effective", "label": "GraphBuild \u00b7 effective", "kind": "model", "group": "corrections", "role": "The DWN after accepted patches. Generated input stays unchanged. GraphBuild.qa_findings retains the graph's original QA; new correction findings are separate on PatchSetResult.", "sub": "actual modified DWN", "notes": [], "detailed": false, "source": {"path": "pipeline/contracts/models.py", "line": 243, "doc": "Constructed graph records and findings passed to storage.", "fields": ["nodes: list[GraphNode]", "edges: list[GraphEdge]", "qa_findings: list[QAFinding]", "summary: GraphSummary"], "signature": null, "code": "class GraphBuild:\n\t\"\"\"Constructed graph records and findings passed to storage.\"\"\"\n\n\tnodes: list[GraphNode]\n\tedges: list[GraphEdge]\n\tqa_findings: list[QAFinding]\n\tsummary: GraphSummary"}}, "outcomes": {"id": "outcomes", "label": "PatchOutcome", "kind": "model", "group": "corrections", "role": "Per-patch result: applied, already_present, not_yet_active, expired or needs_review. This is separate from QA severity.", "sub": "", "notes": [], "detailed": true, "source": {"path": "pipeline/contracts/models_corrections.py", "line": 31, "doc": "Outcome of one patch during replay.", "fields": [], "signature": null, "code": "class PatchOutcome(StrEnum):\n\t\"\"\"Outcome of one patch during replay.\"\"\"\n\n\tAPPLIED = \"applied\"\n\tALREADY_PRESENT = \"already_present\"\n\tNOT_YET_ACTIVE = \"not_yet_active\"\n\tEXPIRED = \"expired\"\n\tNEEDS_REVIEW = \"needs_review\""}}, "correction_qa": {"id": "correction_qa", "label": "list[QAFinding] \u00b7 corrections", "kind": "model", "group": "corrections", "role": "Findings from patch replay, including unresolved targets, snapshot changes and already-present notices. Returned separately from GraphBuild.qa_findings and the generation QA stream.", "sub": "", "notes": [], "detailed": true, "source": {"path": "pipeline/contracts/models.py", "line": 286, "doc": "A reviewable observation associated with a pipeline run and stage.\n\nStorage can deduplicate findings by run, stage, type, and related feature IDs.", "fields": ["finding_type: str", "severity: FindingSeverity", "message: str", "stage: PipelineStage", "run: GenerationRun", "coordinate: Coordinate | None = None", "related_feature_ids: list[str] | None = None", "details: dict[str, QAFindingDetail] | None = None"], "signature": null, "code": "class QAFinding:\n\t\"\"\"A reviewable observation associated with a pipeline run and stage.\n\n\tStorage can deduplicate findings by run, stage, type, and related feature IDs.\n\t\"\"\"\n\n\tfinding_type: str  # Keep codes open until the validation UI defines which values need dedicated presentation.\n\tseverity: FindingSeverity\n\tmessage: str\n\tstage: PipelineStage\n\trun: GenerationRun\n\tcoordinate: Coordinate | None = None\n\trelated_feature_ids: list[str] | None = None\n\t# Keep measurements separate from display text so code never needs to parse the message.\n\tdetails: dict[str, QAFindingDetail] | None = None"}}, "demo_export": {"id": "demo_export", "label": "export_review()", "kind": "function", "group": "corrections", "role": "Den Haag-specific wrapper: calls apply_patches(), validates/checks the result, then exports both generated and effective graphs plus patch/QA review layers. It requires every saved patch to apply.", "sub": "", "notes": [], "detailed": true, "source": {"path": "pipeline_tools/demo_den_haag_hs.py", "line": 430, "doc": "Apply the saved patches and export both graphs together.", "fields": [], "signature": "export_review(destination: Path, result: PipelineResult, patches: list[Patch], run: GenerationRun, *, at: datetime) -> dict", "code": "def export_review(destination: Path, result: PipelineResult, patches: list[Patch], run: GenerationRun, *, at: datetime) -> dict:\n\t\"\"\"Apply the saved patches and export both graphs together.\"\"\"\n\treplay = apply_patches(result.graph, patches, run, at=at)\n\tif any(outcome != PatchOutcome.APPLIED for outcome in replay.outcomes.values()):\n\t\toutcomes = \", \".join(f\"{patch_id}: {outcome}\" for patch_id, outcome in replay.outcomes.items())\n\t\tmessages = \" \".join(finding.message for finding in replay.qa_findings)\n\t\traise ValueError(f\"Review the saved patches on the new DWN: {outcomes}. {messages}\")\n\teffective = replay.effective_dwn\n\tvalidate_graph_records(effective.nodes, effective.edges)\n\tvalidation = validate_graph(effective, \"EPSG:28992\", run, GraphConstructionSettings(minimum_edge_length_m=0.01))\n\tassert not any(finding.severity == \"error\" for finding in validation)\n\tassert effective.summary.component_count \u003c result.graph.summary.component_count\n\troutes = route_examples(result.graph, effective, patches, run)\n\tadded_edges = [edge for edge in effective.edges if edge.creating_patch_id is not None]\n\texpected_count = sum(len(patch.operations) for patch in patches)\n\tassert len(added_edges) == expected_count\n\n\trepeated = apply_patches(effective, patches, run, at=at)\n\tassert all(outcome == PatchOutcome.ALREADY_PRESENT for outcome in repeated.outcomes.values())\n\n\toriginal_ids = {edge.edge_id for edge in result.graph.edges}\n\tgenerated_edges = graph_edges(result.graph, \"generated\", original_ids)\n\teffective_edges = graph_edges(effective, \"effective\", original_ids)\n\tlocations = patch_locations(patches)\n\tsidewalks = gpd.read_file(result.data_folder / \"bgt_highway.gpkg\")\n\tsidewalks = sidewalks[[\"lokaal_id\", \"functie\", \"relatieve_hoogteligging\", \"geometry\"]]\n\tlayers = {\n\t\t\"generated_edges\": generated_edges,\n\t\t\"generated_nodes\": nodes_geodataframe(result.graph.nodes),\n\t\t\"effective_edges\": effective_edges,\n\t\t\"effective_nodes\": nodes_geodataframe(effective.nodes),\n\t\t\"added_crossings\": effective_edges[effective_edges[\"change\"] == \"added\"],\n\t\t\"patch_locations\": locations,\n\t\t\"source_sidewalks\": sidewalks,\n\t\t\"generated_qa\": qa_findings_geodataframe(result.qa_findings),\n\t\t\"correction_qa\": qa_findings_geodataframe(replay.qa_findings),\n\t\t\"effective_validation\": qa_findings_geodataframe(validation),\n\t}\n\tdestination.mkdir(parents=True, exist_ok=True)\n\tpackage = destination / \"comparison.gpkg\"\n\tpackage.unlink(missing_ok=True)\n\twrite_geopackage(package, layers)\n\tfor name, frame in layers.items():\n\t\tassert len(gpd.read_file(package, layer=name)) == len(frame), name\n\t_save_comparison_geojson(destination, generated_edges, effective_edges, locations)\n\t(destination / \"patches.json\").write_text(\n\t\tjson.dumps([patch.model_dump() for patch in patches], default=json_value, indent=2) + \"\\n\"\n\t)\n\tsave_comparison(destination, result.graph, effective, patches, sidewalks)\n\treturn {\n\t\t\"outcomes\": replay.outcomes,\n\t\t\"routes\": routes,\n\t\t\"generated\": {\n\t\t\t\"nodes\": len(result.graph.nodes),\n\t\t\t\"edges\": len(result.graph.edges),\n\t\t\t\"components\": result.graph.summary.component_count,\n\t\t},\n\t\t\"effective\": {\n\t\t\t\"nodes\": len(effective.nodes),\n\t\t\t\"edges\": len(effective.edges),\n\t\t\t\"components\": effective.summary.component_count,\n\t\t},\n\t\t\"patches\": [{\"patch_id\": patch.patch_id, \"reason\": patch.message} for patch in patches],\n\t\t\"evidence\": {\"service\": AERIAL_URL, \"layer\": \"2025_ortho25\", \"crs\": \"EPSG:28992\", \"bbox\": [81800, 454000, 82150, 454250]},\n\t\t\"note\": \"Crossing routes were traced by eye for this demo, not surveyed. Generated QA describes the unpatched run.\",\n\t}"}}, "demo_files": {"id": "demo_files", "label": "Den Haag review exports", "kind": "file", "group": "corrections", "role": "output/manual-corrections/den-haag-hs/: comparison.gpkg, generated.geojson, effective.geojson, comparison.geojson, patches.json, comparison.png and run metadata.", "sub": "both graphs + patches + separate QA", "notes": [], "detailed": false, "source": null}, "snapshot": {"id": "snapshot", "label": "RegionState", "kind": "model", "group": "corrections", "role": "A local graph snapshot containing nodes and edges. Used for expected_before and desired_after, and when selecting the current bbox region.", "sub": "", "notes": [], "detailed": true, "source": {"path": "pipeline/contracts/models_corrections.py", "line": 79, "doc": "Local DWN snapshot for patch replay.", "fields": ["nodes: list[GraphNode]", "edges: list[GraphEdge]"], "signature": null, "code": "class RegionState(PatchModel):\n\t\"\"\"Local DWN snapshot for patch replay.\"\"\"\n\n\t# recheck snapshots when building a Patch in case they changed after creation\n\tmodel_config = ConfigDict(revalidate_instances=\"always\")\n\n\tnodes: list[GraphNode]\n\tedges: list[GraphEdge]\n\n\t@model_validator(mode=\"after\")\n\tdef validate_edges(self) -> RegionState:\n\t\t\"\"\"Require valid graph records and consistent endpoints.\"\"\"\n\t\tvalidate_graph_records(self.nodes
