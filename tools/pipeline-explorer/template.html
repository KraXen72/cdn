<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pipeline explorer</title>
<style>
/* DIAGRAM_STYLES */
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="identity"><strong>Pipeline</strong></div>
    <div class="segmented" role="group" aria-label="Diagram detail level"><button data-view="stages" aria-pressed="true">Stages</button><button data-view="functions" aria-pressed="false">Major functions</button></div>
    <div class="searchbox"><input id="search" type="search" placeholder="Search" aria-label="Search diagram"><div id="searchResults"></div></div>
  </div>
</header>
<main>
  <div class="workspace">
    <nav class="stage-nav" aria-label="Pipeline stages"></nav>
    <section id="canvas" aria-label="Interactive pipeline diagram">
      <div id="diagram"></div>
      <div class="tools" role="group" aria-label="Diagram navigation"><button id="zoomOut" title="Zoom out (−)">−</button><span id="zoomLevel"></span><button id="zoomIn" title="Zoom in (+)">+</button><span class="divider"></span><button id="fit" title="Fit the whole map (F)">Fit all</button><button id="readable" title="View at readable size (R)">Readable</button><button id="reset" title="Clear selection (Escape)">Clear</button></div>
      <div class="map-wrap"><svg id="minimap" aria-label="Diagram minimap"></svg></div>
    </section>
    <div class="legend"><span class="key"><i class="swatch function"></i>Function</span><span class="key"><i class="swatch"></i>Model</span><span class="key"><i class="swatch ref"></i>Reference</span><span class="key"><i class="swatch context"></i>Context</span><span class="key"><i class="swatch file"></i>File</span></div>
  </div>
  <aside id="inspector" aria-label="Selected item details" aria-live="polite"></aside>
</main>
<script>
"use strict";
const DATA = /* DIAGRAM_DATA */;
const diagram = document.querySelector('#diagram');
const inspector = document.querySelector('#inspector');
const canvas = document.querySelector('#canvas');
const minimap = document.querySelector('#minimap');
const search = document.querySelector('#search');
const searchResults = document.querySelector('#searchResults');
let currentView = 'stages';
let selected = null;
let svg;
let fullBounds;
let viewBox;
let cameraStates = {};
let drag = null;
let suppressClick = false;
let focusedGroup = 'acquisition';
const escapeHtml = value => String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const escapeLabel = value => escapeHtml(value).replaceAll('·', '&bull;');
const current = () => DATA.views[currentView];
const nodeElement = id => document.getElementById('node_' + id);
const displayKind = item => ({model:'Model',function:'Function',stage:'Stage',reference:'Reference',context:'Context',file:'File'}[item.kind]);

function applyCamera() {
  svg.setAttribute('viewBox', `${viewBox.x} ${viewBox.y} ${viewBox.width} ${viewBox.height}`);
  const zoom = canvas.clientWidth / viewBox.width;
  document.querySelector('#zoomLevel').textContent = Math.round(zoom * 100) + '%';
  const rect = minimap.querySelector('.viewport');
  if (rect) for (const name of ['x','y','width','height']) rect.setAttribute(name,viewBox[name]);
}

function focusBox(box, padding = 65) {
  const availableWidth = Math.max(canvas.clientWidth - 70, 200);
  const availableHeight = Math.max(canvas.clientHeight - 70, 180);
  const scale = Math.max(.95, Math.min(availableWidth / (box.width + padding * 2), availableHeight / (box.height + padding * 2), 1.3));
  const width = canvas.clientWidth / scale;
  const height = canvas.clientHeight / scale;
  viewBox = {x:box.x + box.width/2 - width/2,
             y:box.y + box.height/2 - height/2, width, height};
  applyCamera();
}

function elementBox(element) {
  const bounds = element.getBBox();
  const matrix = svg.getScreenCTM().inverse().multiply(element.getScreenCTM());
  const first = new DOMPoint(bounds.x,bounds.y).matrixTransform(matrix);
  const second = new DOMPoint(bounds.x+bounds.width,bounds.y+bounds.height).matrixTransform(matrix);
  return {x:first.x,y:first.y,width:second.x-first.x,height:second.y-first.y};
}

function focusNode(id) {
  const element = nodeElement(id);
  if (!element) return;
  focusBox(elementBox(element), 150);
}

function fitAll() {
  const scale = Math.min((canvas.clientWidth-55)/fullBounds.width,(canvas.clientHeight-55)/fullBounds.height);
  const width = canvas.clientWidth/scale;
  const height = canvas.clientHeight/scale;
  viewBox = {x:fullBounds.x+(fullBounds.width-width)/2,y:fullBounds.y+(fullBounds.height-height)/2,width,height};
  applyCamera();
}

function zoomAt(factor, screenX = canvas.clientWidth/2, screenY = canvas.clientHeight/2) {
  const newWidth = Math.max(160,Math.min(fullBounds.width*2,viewBox.width/factor));
  const ratio = newWidth/viewBox.width;
  viewBox = {x:viewBox.x + screenX/canvas.clientWidth*viewBox.width*(1-ratio),
             y:viewBox.y + screenY/canvas.clientHeight*viewBox.height*(1-ratio),
             width:newWidth,height:viewBox.height*ratio};
  applyCamera();
}

function renderMinimap() {
  minimap.replaceChildren();
  minimap.setAttribute('viewBox', `${fullBounds.x} ${fullBounds.y} ${fullBounds.width} ${fullBounds.height}`);
  const graphic = svg.querySelector('g.graph').cloneNode(true);
  graphic.querySelectorAll('[id]').forEach(el=>el.removeAttribute('id'));
  graphic.querySelectorAll('title,text').forEach(el=>el.remove());
  graphic.querySelectorAll('.node,.edge').forEach(el=>el.classList.remove('selected','muted','incoming','outgoing'));
  minimap.append(graphic);
  const rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
  rect.classList.add('viewport');
  minimap.append(rect);
}

function highlight() {
  const activeEdges = new Set();
  const neighbors = new Set();
  if (selected?.type === 'node') {
    neighbors.add(selected.id);
    for (const item of current().edges) {
      if (item.from === selected.id || item.to === selected.id) {
        activeEdges.add(item.id); neighbors.add(item.from); neighbors.add(item.to);
      }
    }
  } else if (selected?.type === 'edge') {
    const item = current().edges.find(edge=>edge.id===selected.id);
    if (item) {activeEdges.add(item.id);neighbors.add(item.from);neighbors.add(item.to);}
  }
  for (const id of current().nodes) {
    const element = nodeElement(id);
    element.classList.toggle('selected',selected?.type==='node'&&selected.id===id);
    element.classList.toggle('muted',Boolean(selected)&&!neighbors.has(id));
  }
  for (const item of current().edges) {
    const element = document.getElementById(item.id);
    element.classList.toggle('muted',Boolean(selected)&&!activeEdges.has(item.id));
    element.classList.toggle('incoming',selected?.type==='node'&&item.to===selected.id);
    element.classList.toggle('outgoing',selected?.type==='node'&&item.from===selected.id);
    element.classList.toggle('selected',selected?.type==='edge'&&selected.id===item.id);
  }
}

function connectionButton(item, direction) {
  const id = direction==='in'?item.from:item.to;
  return `<button class="connection" data-node="${id}"><strong><span class="arrow-${direction}" style="display:inline">${direction==='in'?'↳':'↗'}</span> ${escapeLabel(DATA.nodes[id].label)}</strong><span>${escapeLabel(item.label)}</span></button>`;
}

function showNode(id, focus = false) {
  focusedGroup = DATA.nodes[id].group;
  updateStageNav();
  if (!current().nodes.includes(id)) {
    setView('functions');
  }
  selected = {type:'node',id};
  const item = DATA.nodes[id];
  const incoming = current().edges.filter(edge=>edge.to===id);
  const outgoing = current().edges.filter(edge=>edge.from===id);
  const source = item.source;
  inspector.innerHTML = `<div class="eyebrow">${escapeLabel(DATA.groups[item.group][0])}</div>
    <h1>${escapeLabel(item.label)}</h1><span class="badge ${item.kind}">${displayKind(item)}</span>
    <p>${escapeHtml(item.role)}</p>
    ${item.notes.map(note=>`<div class="note">${escapeHtml(note)}</div>`).join('')}
    ${source?`<div class="source-location">${escapeHtml(source.path)}:${source.line}</div>`:''}
    ${source?.signature?`<h2>Signature</h2><div class="signature">${escapeHtml(source.signature)}</div>`:''}
    ${source?.fields?.length?`<h2>Fields</h2><div class="fields">${source.fields.map(field=>`<code>${escapeHtml(field)}</code>`).join('')}</div>`:''}
    ${incoming.length?`<h2 class="incoming-title">Incoming &bull; ${incoming.length}</h2>${incoming.map(edge=>connectionButton(edge,'in')).join('')}`:''}
    ${outgoing.length?`<h2 class="outgoing-title">Outgoing &bull; ${outgoing.length}</h2>${outgoing.map(edge=>connectionButton(edge,'out')).join('')}`:''}
    ${source?`<details><summary>Python source</summary><pre>${escapeHtml(source.code)}</pre></details>`:''}
    <button id="clear">Clear</button>`;
  inspector.scrollTop = 0;
  highlight();
  if (focus) focusNode(id);
}

function showEdge(id) {
  const item = current().edges.find(edge=>edge.id===id);
  selected = {type:'edge',id};
  inspector.innerHTML = `<div class="eyebrow">Data handoff</div><h1>${escapeLabel(item.label)}</h1>
    <span class="badge">${escapeHtml(item.kind)}</span><h2>From</h2>${connectionButton(item,'in')}
    <h2>To</h2>${connectionButton(item,'out')}<button id="clear">Clear</button>`;
  inspector.scrollTop = 0;
  highlight();
}

function welcome() {
  selected = null;
  inspector.innerHTML = `<h1>Data handoffs</h1>
    <p><strong>Payloads</strong> contain the records: SurfaceFeature, Centerline, GraphBuild.</p>
    <p><strong>ArtifactRef</strong> contains metadata and a URI. Geometry is stored separately.</p>
    <p><strong>Contexts</strong> retain records in memory in the current runner. GeoPackage and GeoJSON exports happen later.</p>
    <div class="note">Corrections run after generation in the Den Haag demo. Standard run_pipeline exports the generated graph.</div>
    <div class="quick-jump"><button data-node="graph_build">GraphBuild</button><button data-node="graph_out">GraphConstructionOutput</button><button data-node="graph_ctx">InMemoryGraphContext</button><button data-node="clean_out">Cleanup output</button><button data-node="patch_result">PatchSetResult</button></div>
    <details><summary>Scope</summary><p>Source: ${escapeHtml(DATA.commit)}. Maps run_pipeline.run_stages(), standard export and the Den Haag corrections demo. Model fields, signatures and source snippets are extracted from the code.</p><p>Private helpers are omitted. TransformationOutputWithMetadata and the payload-shaped SkeletonizationOutput in stage_contracts.py are unused here. Fusion, exclusion zones and corridor generation are not executed.</p><p>Repeated model types represent different values: raw/cleaned centerlines and generated/effective graphs.</p></details>
    <div class="downloads"><a class="download" href="${currentView}.dot" download>.dot</a><a class="download" href="${currentView}.svg" download>.svg</a></div>`;
  highlight();
}

function updateStageNav() {
  document.querySelectorAll('[data-group]').forEach(button=>{
    if (button.dataset.group===focusedGroup) button.setAttribute('aria-current','step');
    else button.removeAttribute('aria-current');
  });
}

function jumpGroup(group) {
  focusedGroup = group;
  updateStageNav();
  if (currentView === 'functions') {
    const entry = current().nodes.find(id => DATA.nodes[id].group === group && DATA.nodes[id].kind === 'stage');
    if (entry) { showNode(entry,true); return; }
  }
  welcome();
  const element = document.getElementById('group_'+group);
  if (element) focusBox(elementBox(element),25);
}

function setView(name) {
  if (svg && name===currentView) return;
  const previousSelection = selected;
  if (svg) cameraStates[currentView] = {...viewBox};
  currentView = name;
  diagram.innerHTML = current().svg;
  svg = diagram.querySelector('svg');
  svg.removeAttribute('width');svg.removeAttribute('height');
  svg.setAttribute('preserveAspectRatio','none');
  svg.setAttribute('role','img');svg.setAttribute('aria-label',name==='stages'?'Pipeline stage dataflow':'Pipeline major function dataflow');
  const box = svg.viewBox.baseVal;
  fullBounds = {x:box.x,y:box.y,width:box.width,height:box.height};
  for (const id of current().nodes) {
    const element = nodeElement(id);
    element.setAttribute('tabindex','0');element.setAttribute('role','button');
    element.setAttribute('aria-label',DATA.nodes[id].label.replaceAll('·','•')+' • '+displayKind(DATA.nodes[id]));
    const title = element.querySelector('title');
    if (title) title.textContent=DATA.nodes[id].label+'\n'+DATA.nodes[id].role;
  }
  document.querySelectorAll('[data-view]').forEach(button=>button.setAttribute('aria-pressed',button.dataset.view===name));
  updateStageNav();
  renderMinimap();
  if (cameraStates[name]) {viewBox=cameraStates[name];applyCamera();}
  else focusBox(elementBox(document.getElementById('group_'+focusedGroup)),25);
  if (previousSelection?.type==='node'&&current().nodes.includes(previousSelection.id)) showNode(previousSelection.id,!cameraStates[name]);
  else welcome();
  searchResults.replaceChildren();
}

document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>setView(button.dataset.view)));
const nav = document.querySelector('.stage-nav');
for (const [id,[title]] of Object.entries(DATA.groups)) {
  const button=document.createElement('button');
  const [number,...rest]=title.split(' · ');
  button.innerHTML=`<small>${number}</small>${escapeLabel(rest.join(' · '))}`;
  button.dataset.group=id;
  button.addEventListener('click',()=>jumpGroup(id));nav.append(button);
}

diagram.addEventListener('click',event=>{
  if (suppressClick) {suppressClick=false;return;}
  const block=event.target.closest('g.node');
  const arrow=event.target.closest('g.edge');
  if (block) showNode(block.id.slice(5));
  else if (arrow) showEdge(arrow.id);
  else welcome();
});
diagram.addEventListener('dblclick',event=>{const block=event.target.closest('g.node');if(block)focusNode(block.id.slice(5));});
diagram.addEventListener('keydown',event=>{const block=event.target.closest('g.node');if(block&&(event.key==='Enter'||event.key===' ')){event.preventDefault();showNode(block.id.slice(5));}});
inspector.addEventListener('click',event=>{
  const button=event.target.closest('[data-node]');
  if(button)showNode(button.dataset.node,true);
  if(event.target.closest('#clear'))welcome();
});
canvas.addEventListener('wheel',event=>{
  event.preventDefault();
  const rect=canvas.getBoundingClientRect();
  zoomAt(Math.exp(-event.deltaY*.0015),event.clientX-rect.left,event.clientY-rect.top);
},{passive:false});
diagram.addEventListener('pointerdown',event=>{
  if(event.button!==0)return;
  drag={x:event.clientX,y:event.clientY,box:{...viewBox},moved:false,id:event.pointerId};
});
diagram.addEventListener('pointermove',event=>{
  if(!drag)return;
  const dx=event.clientX-drag.x,dy=event.clientY-drag.y;
  if(Math.hypot(dx,dy)>4&&!drag.moved){drag.moved=true;diagram.setPointerCapture(event.pointerId);svg.classList.add('dragging');}
  if(drag.moved){viewBox={...drag.box,x:drag.box.x-dx/canvas.clientWidth*drag.box.width,y:drag.box.y-dy/canvas.clientHeight*drag.box.height};applyCamera();}
});
function finishDrag(event){if(!drag)return;suppressClick=drag.moved;svg.classList.remove('dragging');if(diagram.hasPointerCapture(event.pointerId))diagram.releasePointerCapture(event.pointerId);drag=null;}
diagram.addEventListener('pointerup',finishDrag);
diagram.addEventListener('pointercancel',finishDrag);
minimap.addEventListener('pointerdown',event=>{
  const point=new DOMPoint(event.clientX,event.clientY).matrixTransform(minimap.getScreenCTM().inverse());
  viewBox={...viewBox,x:point.x-viewBox.width/2,y:point.y-viewBox.height/2};applyCamera();
});
function readable(){
  if(selected?.type==='node')return focusNode(selected.id);
  const width=canvas.clientWidth/.85,height=canvas.clientHeight/.85;
  viewBox={x:viewBox.x+viewBox.width/2-width/2,y:viewBox.y+viewBox.height/2-height/2,width,height};applyCamera();
}
document.querySelector('#fit').addEventListener('click',fitAll);
document.querySelector('#readable').addEventListener('click',readable);
document.querySelector('#reset').addEventListener('click',welcome);
document.querySelector('#zoomIn').addEventListener('click',()=>zoomAt(1.25));
document.querySelector('#zoomOut').addEventListener('click',()=>zoomAt(.8));
search.addEventListener('input',()=>{
  const query=search.value.trim().toLowerCase();searchResults.replaceChildren();if(!query)return;
  const matches=Object.values(DATA.nodes).filter(item=>(item.label+' '+item.group+' '+item.role).toLowerCase().includes(query));
  const score=item=>{
    const label=item.label.toLowerCase();
    const relevance=label===query?1000:label.startsWith(query)?500:label.includes(query)?200:0;
    return relevance+Number(current().nodes.includes(item.id))*10;
  };
  matches.sort((a,b)=>score(b)-score(a));
  for(const item of matches.slice(0,15)){
    const button=document.createElement('button');
    button.innerHTML=`${escapeLabel(item.label)}<small>${displayKind(item)} &bull; ${escapeLabel(DATA.groups[item.group][0])}${current().nodes.includes(item.id)?'':' &bull; functions'}</small>`;
    button.addEventListener('click',()=>{showNode(item.id,true);search.value='';searchResults.replaceChildren();search.blur();});
    searchResults.append(button);
  }
  if(!matches.length)searchResults.textContent='No matching blocks.';
});
search.addEventListener('keydown',event=>{if(event.key==='Enter')searchResults.querySelector('button')?.click();});
document.addEventListener('keydown',event=>{
  if(event.key==='Escape'){search.value='';searchResults.replaceChildren();search.blur();welcome();return;}
  if(event.target.matches('input,textarea'))return;
  if(event.key==='/' ){event.preventDefault();search.focus();}
  if(event.key.toLowerCase()==='f')fitAll();
  if(event.key.toLowerCase()==='r')readable();
  if(event.key==='+'||event.key==='=')zoomAt(1.25);
  if(event.key==='-')zoomAt(.8);
});
document.addEventListener('click',event=>{if(!event.target.closest('.searchbox'))searchResults.replaceChildren();});
new ResizeObserver(()=>{if(viewBox){viewBox.height=viewBox.width*canvas.clientHeight/canvas.clientWidth;applyCamera();}}).observe(canvas);
setView('stages');
</script>
</body>
</html>
