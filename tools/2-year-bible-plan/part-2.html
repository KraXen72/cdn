<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#100F0F">
  <meta name="description" content="Dvojročný plán čítania Biblie, 518 čítaní, s priebežným ukladaním a zálohami.">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css">
  <title>Časť 2 | 2-Year Bible Reading Plan</title>
  <script defer src="./app.js"></script>
</head>
<body data-part="2">
  <header class="topbar">
    <div class="shell bar-row">
      <a class="brand" href="./" aria-label="2-Year Bible Reading Plan"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7c-2.8-2-5.4-2.2-9-1.7v13.3c3.5-.5 6.4-.2 9 1.5m0-13.1c2.8-2 5.4-2.2 9-1.7v13.3c-3.5-.5-6.4-.2-9 1.5M12 7v13.1"/></svg><span>2-Year Bible Reading Plan</span></a>
      <details class="menu" id="backup-menu">
        <summary class="icon-button" aria-label="Záloha a ďalšie možnosti" title="Možnosti"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="12" cy="19" r="1.3"/></svg></summary>
        <div class="menu-panel">
          <button type="button" id="export">Exportovať postup</button>
          <button type="button" id="import">Importovať zálohu</button>
          <a href="https://www.blueletterbible.org/assets-v3/pdf/dbrp/2Yr_CanonicalFiveDayPlan.pdf" target="_blank" rel="noopener noreferrer">Zdrojový plán</a>
        </div>
      </details>
    </div>
  </header>
  <main class="shell">
    <div class="overview">
      <div class="overview-row">
        <label class="part-picker">
          <select id="part-select" aria-label="Vybrať časť">
            <option value="1">Časť 1 / 4</option>
            <option value="2" selected>Časť 2 / 4</option>
            <option value="3">Časť 3 / 4</option>
            <option value="4">Časť 4 / 4</option>
          </select>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </label>
        <span class="total-progress" id="total-count">0 / 518</span>
      </div>
      <div class="progress-track" id="total-track" role="progressbar" aria-label="Celkový postup" aria-valuemin="0" aria-valuemax="518" aria-valuenow="0">
        <div class="progress-fill" id="total-bar"></div>
      </div>
      <label class="bulk-control">
        <span id="part-checkbox-wrap"></span>
        <span>Označiť celú časť</span>
      </label>
    </div>
    <p class="save-status" id="save-status" role="status" hidden></p>
    <div id="content" aria-live="off">Načítava sa plán…</div>
  </main>
  <div class="toast" id="toast" role="status" hidden></div>
  <input id="import-file" type="file" accept="application/json,.json" hidden>
</body>
</html>
